<style>

.bottomnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:28px}.footer{color:var(--sub);font-size:11px;text-align:center;margin-top:45px}
.mobile-menu{display:none}.mask{display:none}.reader-only .sidebar{display:none}.reader-only .site{grid-template-columns:1fr}.reader-only .main{max-width:900px}.reader-only .topbar{padding:0 calc((100% - 820px)/2);padding-inline:max(24px,calc((100% - 820px)/2))}
/* speaking practice */
#prompter{position:fixed;inset:0;z-index:90;background:#0a1422;color:#ecf6fa;display:none;flex-direction:column}.prompter-open #prompter{display:flex}.prompter-top{height:69px;border-bottom:1px solid #263951;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:0 22px}.prompter-title{font-size:13px;font-weight:820;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prompter-controls{display:flex;gap:8px;align-items:center}.prompter-btn{padding:8px 12px;background:#1d2c41;border:1px solid #345067;color:#ecf6fa;border-radius:8px;font-size:12px;font-weight:750}.prompter-btn.on{background:#087d72}.speed{width:100px;accent-color:#4fc8b7}#prompter-scroller{overflow:auto;flex:1;scroll-behavior:auto}.prompter-content{max-width:780px;padding:80px 30px 55vh;margin:0 auto}.prompter-content h2{color:#59d7c1;font-size:18px;margin:30px 0 23px}.prompter-content p{font-size:clamp(24px,3vw,34px);line-height:1.8;margin:0 0 30px;font-weight:490}.prompter-top .prompter-btn:hover{background:#2e485d}
@media(max-width:1000px){.site{grid-template-columns:244px minmax(0,1fr)}.topbar{padding:0 23px}.main{padding:26px 23px 70px}.sidebar .brand{padding:24px 14px 16px}.navlist{padding:0 6px}}
@media(max-width:740px){.site{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;width:278px;transform:translateX(-100%);transition:transform .22s;box-shadow:12px 0 25px rgba(0,0,0,.15)}body.nav-open .sidebar{transform:translateX(0)}.mask{display:block;position:fixed;inset:0;background:rgba(3,14,28,.5);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}body.nav-open .mask{opacity:1;pointer-events:auto}.mobile-menu{display:grid}.topbar{height:57px;padding:0 14px}.crumb{font-size:11px;max-width:46%}.toptools{gap:5px}.tool-btn{width:31px;height:31px}.tool-cta{padding:9px 10px;font-size:11px}.main{padding:19px 14px 70px}.hero{padding:25px 22px}.hero h1{font-size:30px}.hero p{font-size:13px}.project-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.metric{padding:12px}.metric strong{font-size:23px}.metric span{font-size:10px}.read-top h1{font-size:25px}.read-controls{gap:7px}.speeches{padding:20px 17px}.speeches p{line-height:1.83}.h2-head h2{font-size:17px}.detail summary{padding:14px 12px;font-size:13px}.detail .detail-answer{padding:0 15px 16px 15px}.prompter-top{padding:0 10px;gap:5px}.prompter-title{display:none}.prompter-controls{width:100%;justify-content:space-between}.speed{width:74px}.prompter-btn{padding:7px 9px}.prompter-content{padding:35px 24px 50vh}.prompter-content p{font-size:24px}.reader-only .topbar{padding:0 14px}}

.speeches p.spoken-example{padding:12px 15px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;font-size:calc(var(--font) - 1px);line-height:1.78;margin:13px 0 16px}
.speeches p.spoken-example::before{content:'VÍ DỤ ĐỂ NHỚ';display:block;color:var(--accent-dark);font-size:10px;font-weight:850;letter-spacing:1px;margin-bottom:5px}
@media print{.speeches p.spoken-example{background:#f6f8f7!important}}

.reflection-highlight{margin:27px 0 10px;padding:21px 24px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:17px;display:flex;align-items:center;justify-content:space-between;gap:20px}

<body>
<div class="mask" id="mask"></div>
<div class="site">
<aside class="sidebar" id="sidebar" aria-label="Điều hướng script">
  <div class="brand"><div class="brandline"><div class="brandicon">✦</div><div class="brandtitle">Interview Script <small>STUDIO · DAIICHI LIFE</small></div></div><div class="subbrand">Luyện trả lời tự nhiên, xưng “em”</div></div>
  <div class="navtools"><div class="mode-switch"><button class="mode-btn active" data-mode="quick">Ôn nhanh</button><button class="mode-btn" data-mode="deep">Chuyên sâu</button></div><input class="navsearch" id="searchInput" type="search" placeholder="⌕  Tìm thuật ngữ hoặc câu hỏi..." autocomplete="off"></div>
  <div class="navlabel" id="navCaption">MỤC LỤC</div><nav class="navlist" id="navList"></nav>
  <div class="sidefoot"><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div class="progress-meta" id="progressMeta">Tiến độ học · 0/0 phần</div><button class="outlinebutton" id="backHome">⌂ Trang tổng quan</button></div>
</aside>
<div class="workspace">
  <header class="topbar"><button id="menuBtn" class="tool-btn mobile-menu" title="Mở mục lục">☰</button><div class="crumb" id="crumb">Trang tổng quan / Script phỏng vấn</div><div class="toptools"><button id="smaller" class="tool-btn" title="Giảm cỡ chữ">A−</button><button id="bigger" class="tool-btn" title="Tăng cỡ chữ">A+</button><button id="themeBtn" class="tool-btn" title="Chuyển nền sáng / tối">◐</button><button id="focusBtn" class="tool-btn" title="Chế độ tập trung">⛶</button><button id="prompterBtn" class="tool-cta" title="Luyện nói tự cuộn">▶ Luyện nói</button></div></header>
  <main class="main" id="main" tabindex="-1"></main>
</div>
</div>

<script>
const DATA={"quick":{"title":"SCRIPT ÔN NHANH — 6 DỰ ÁN","sections":[{"id":"intro","title":"Giới thiệu & hướng dẫn","items":[{"type":"meta","text":"Xưng “em” • Ưu tiên Data Preprocessing • Học câu chuyện trước, mở rộng kỹ thuật khi được hỏi"}]},{"id":"s1","title":"Mở đầu — 45–60 giây","items":[{"type":"speech","text":"Dạ em chào anh/chị. Em học Computer Science theo hướng Data Science. Trong quá trình học và đi làm, em tập trung vào việc xử lý dữ liệu, phân tích kết quả và ứng dụng Machine Learning vào những bài toán cụ thể. Trước đây em làm Data Analyst ở MWG, chủ yếu chuẩn bị dữ liệu và báo cáo về đánh giá khách hàng, chất lượng phục vụ cửa hàng. Hiện tại em làm các công việc liên quan đến Data và AI/ML tại Daiichi Life Việt Nam, trong đó có đánh giá hệ thống nhận dạng cuộc gọi, phân tích log của AI service và một dự án phân tích năng lực phục vụ luân chuyển nhân sự. Ngoài ra, em có hai dự án cá nhân về Credit Score Prediction và Housing Price Prediction để rèn thêm phần Machine Learning. Điểm em chú trọng là hiểu vấn đề nghiệp vụ trước, sau đó mới chọn công cụ, kiểm tra chất lượng dữ liệu và đánh giá kết quả có thực sự hữu ích hay không."}]},{"id":"s2","title":"Câu khung về Data Preprocessing — nói khi được hỏi","items":[{"type":"speech","text":"Dạ, nếu anh/chị hỏi em tiếp cận một dataset mới ra sao, em sẽ không làm sạch ngay. Đầu tiên em hỏi mục tiêu phân tích là gì và một dòng dữ liệu đại diện cho điều gì. Tiếp đó em làm data profiling: xem schema, tỷ lệ missing, phân bố, giá trị bất hợp lý, khóa trùng và phân bố target nếu là ML. Sau khi hiểu nguyên nhân, em mới chọn cách cleaning như parse text thành numeric, xử lý missing, duplicate hay outlier theo business rules. Nếu là bài toán ML, em tránh để test ảnh hưởng đến imputation, scaling và feature selection. Cuối cùng em validation lại số dòng, kiểu dữ liệu, tỷ lệ missing, phân bố và kết quả trên tập đánh giá. Em nghĩ preprocessing tốt là khi dữ liệu không chỉ chạy được mà còn đúng về nghiệp vụ và kiểm chứng được ạ."},{"type":"speech","text":"Ví dụ rất rõ là ở Talent Mobility: nếu em chỉ thấy Team và Role lặp lại rồi xóa bớt, em có thể vô tình xóa mất một yêu cầu kỹ năng. Khi đó bảng nhìn sạch nhưng kết quả Skill Gap lại sai. Vì vậy, em nghĩ đúng nghiệp vụ phải được ưu tiên trước khi chạy bất kỳ lệnh làm sạch nào."}]},{"id":"s3","title":"01  CALL TRANSCRIPTION & SPEECH ANALYTICS — DAIICHI LIFE","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Vấn đề cuộc gọi → Survey → Benchmark → RCA → Prompt → Regression Test → Giá trị cho team"},{"type":"speech","text":"Dạ, dự án này xuất phát từ nhu cầu biến nội dung cuộc gọi tổng đài thành dữ liệu đáng tin cậy để phục vụ kiểm tra chất lượng và phân tích. Nếu audio chỉ được lưu dưới dạng ghi âm thì việc tìm kiếm hoặc trích xuất những thông tin như số tiền, tên hay mã hợp đồng sẽ rất khó tự động hóa. Trong pipeline, S2T chuyển audio thành transcript, còn NER lấy thông tin quan trọng từ transcript đó."},{"type":"speech","text":"Phần em tham gia bắt đầu từ việc khảo sát các mô hình và API. Em xây dựng bộ tiêu chí có trọng số để đánh giá ứng viên, vì em nghĩ không thể chỉ chọn một mô hình dựa trên độ chính xác chung: với dữ liệu bảo hiểm còn phải quan tâm đến thông tin quan trọng, tốc độ, chi phí, quyền riêng tư và khả năng triển khai. Sau đó, em dùng Python xây dựng framework benchmark có thể thay mô hình và chạy trên cùng một bộ 80 audio với transcript chuẩn, đo các chỉ số như WER, CER và RTF. Em cũng thử VAD, segmentation và một số cấu hình inference cho audio dài."},{"type":"speech","text":"Ví dụ để dễ hình dung: một mô hình có thể nhận đúng gần hết cuộc gọi nhưng lại đọc nhầm ‘21 triệu’ thành ‘211 triệu’. Nếu chỉ nhìn độ chính xác trung bình, team có thể bỏ qua một lỗi rất quan trọng với nghiệp vụ bảo hiểm. Vì thế em muốn đánh giá riêng những thông tin như số tiền, tên và mã hợp đồng."},{"type":"speech","text":"Khi phân tích những trường hợp sai, em đối chiếu transcript AI với ground truth, rồi đối chiếu entities được trích xuất với chính transcript AI. Nhờ vậy, team có thể xác định lỗi bắt đầu từ nhận dạng giọng nói hay từ bước trích xuất. Từ kết quả RCA, em tối ưu hướng dẫn prompt và chạy regression testing để kiểm tra xem lỗi mục tiêu cải thiện nhưng các trường hợp khác có bị xấu đi không."},{"type":"speech","text":"Trên một tập kiểm thử Q3, WER giảm từ 14,35% xuống 10,84% và Perfect Rate tăng từ 34,57% lên 44,79%. Tuy nhiên, em cũng ghi nhận một tập khác có regression, nên em không xem đây là cải thiện đồng đều của toàn bộ hệ thống. Đóng góp em thấy rõ nhất là giúp team có cách đánh giá lặp lại được và có bằng chứng cụ thể để ưu tiên đúng nhóm lỗi cần sửa."},{"type":"speech","text":"Ví dụ, nếu phiên bản mới sửa được những câu có số tiền trong tập Q3 nhưng lại làm hỏng những cuộc gọi vốn nhận dạng tốt ở tập khác, em sẽ báo rõ cả hai chiều kết quả. Team cần biết thay đổi nào có thể chấp nhận được chứ không chỉ thấy một con số WER đẹp hơn."}]},{"id":"s4","title":"02  AI SERVICE LOG ANALYTICS — DAIICHI LIFE","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Log khó đọc → Db2 / SQL → Python parse → Dữ liệu có cấu trúc → Usage & concurrency → Team monitoring"},{"type":"speech","text":"Dạ, với bài toán AI Service Analytics, vấn đề ban đầu là dữ liệu vận hành nằm trong các bản ghi log, và một phần thông tin được chứa chung trong một cột nên chưa thuận tiện cho việc phân tích. Mục tiêu của em là chuyển nguồn dữ liệu kỹ thuật này thành dữ liệu có cấu trúc để team có thể theo dõi hoạt động dịch vụ."},{"type":"speech","text":"Cách em làm là truy vấn dữ liệu từ bảng OCR staging trên IBM Db2 bằng SQL. Sau đó, em dùng Python để parse nội dung log, tách các trường cần thiết thành từng cột và chuẩn bị dữ liệu để phân tích. Trên dữ liệu này, em tập trung vào các chỉ số như số request theo ngày, tháng, năm và mức độ hoạt động đồng thời."},{"type":"speech","text":"Em chọn kết hợp SQL và Python vì SQL phù hợp cho việc lấy dữ liệu nguồn theo điều kiện, còn Python linh hoạt hơn khi cần tách log bán cấu trúc và xử lý định dạng phức tạp. Giá trị đối với team là không phải nhìn từng dòng log thô, mà có thể xem các xu hướng sử dụng để hỗ trợ việc theo dõi hoạt động AI service."}]},{"id":"s5","title":"03  TALENT MOBILITY & WORKFORCE ANALYTICS — DAIICHI LIFE","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Luân chuyển nhân sự → Data quality → Grain / duplicate → Two-table model → Skill gap & matching → Team decision support"},{"type":"speech","text":"Dạ, dự án Talent Mobility hướng tới việc hỗ trợ team xem một nhân viên có thể phù hợp với những vị trí nào trong các Agile Teams khác, dựa trên năng lực hiện tại và yêu cầu kỹ năng của vị trí mục tiêu. Đầu ra mong muốn không phải tự quyết định ai được luân chuyển, mà là cung cấp dữ liệu và điểm đánh giá để quản lý tham khảo."},{"type":"speech","text":"Phần em tập trung khá nhiều là data quality và cấu trúc dữ liệu. Ban đầu có nhiều bảng và có hiện tượng lặp Team, Role. Em dùng Power Query để group và kiểm tra nhưng em không xóa ngay, vì một role có nhiều skills thì việc Team và Role lặp lại là hoàn toàn hợp lệ. Em phải xem một dòng đang đại diện cho điều gì, tức data grain, và xác định tổ hợp khóa nghiệp vụ trước khi loại duplicate thực sự."},{"type":"speech","text":"Sau đó em tổ chức pipeline theo hai bảng chính, sử dụng Python để tính các chỉ số như role similarity, skill gap, readiness và candidate matching theo business rules. Kết quả được thể hiện trên giao diện demo để dễ lọc theo team hoặc role. Điều em muốn đóng góp cho team là dữ liệu sạch hơn, cách scoring nhất quán hơn và khả năng thấy rõ vì sao một người phù hợp hoặc còn thiếu kỹ năng nào."},{"type":"speech","text":"Ví dụ em hình dung một vị trí yêu cầu SQL và Python. Nếu hệ thống bỏ sót dòng Python do xóa nhầm duplicate, nhân viên biết SQL có thể bị chấm là đã đủ kỹ năng. Việc kiểm tra grain giúp team tránh đưa ra một recommendation tưởng hợp lý nhưng thực chất thiếu dữ liệu."}]},{"id":"s6","title":"04  CUSTOMER & STORE EVALUATION — MWG","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Chất lượng phục vụ → Raw data nội bộ → Python → Excel report → So sánh KPI → Hỗ trợ team vận hành"},{"type":"speech","text":"Dạ, ở MWG em làm với dữ liệu đánh giá của khách hàng và chất lượng phục vụ cửa hàng. Mục tiêu chính là giúp team có số liệu tổng hợp để theo dõi những chỉ số như customer satisfaction, tỷ lệ tiếp cận khảo sát và chất lượng phục vụ, rồi so sánh giữa các chuỗi hoặc các khu vực."},{"type":"speech","text":"Quy trình thực tế của em bắt đầu bằng việc lấy raw data thủ công từ nền tảng nội bộ. Sau đó em dùng Python để xử lý dữ liệu, chuẩn bị kết quả và xuất báo cáo Excel. Khi xem báo cáo, em không chỉ nhìn một con số tổng, mà cố gắng so sánh theo thời gian, theo chuỗi bán lẻ hoặc theo vùng để thấy biến động tập trung ở đâu."},{"type":"speech","text":"Em nghĩ giá trị của công việc này là giúp team bớt phải làm việc trực tiếp trên dữ liệu thô và có báo cáo nhất quán hơn cho các buổi review vận hành. Nếu một KPI giảm, số liệu đó là điểm bắt đầu để team kiểm tra thêm chứ chưa đủ để khẳng định ngay nguyên nhân."},{"type":"speech","text":"Ví dụ giả định, nếu tỷ lệ hài lòng giảm từ 90% xuống 85%, em sẽ không vội kết luận cửa hàng phục vụ kém đi. Em cần tách theo chuỗi, khu vực, kênh khảo sát và số lượng phản hồi để xem biến động đến từ đâu. Có vậy team mới biết cần kiểm tra cửa hàng nào trước."}]},{"id":"s7","title":"05  CREDIT SCORE PREDICTION — INDEPENDENT PROJECT","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Business → Data profiling → Cleaning/regex → Missing/Outliers → Total_CHA → GA 12 features → Train/Test → RF vs NB → Metrics"},{"type":"speech","text":"Dạ, ở Credit Score Prediction, em sử dụng bộ dữ liệu tài chính hơn 100.000 bản ghi để dự đoán nhóm tín nhiệm của khách hàng. Em tập trung nhiều nhất ở phần dữ liệu: kiểm tra schema và các giá trị bất thường, loại cột không cần thiết như Name, xử lý thu nhập âm hoặc số đếm không hợp lệ, rồi dùng regex để làm sạch các trường số đang chứa ký tự không nhất quán. Em luôn cố gắng hiểu vì sao dữ liệu sai trước khi quyết định xóa hay điền."},{"type":"speech","text":"Tiếp theo em làm feature engineering: ví dụ Credit History Age là 5 năm 3 tháng thì em đổi thành Total_CHA = 63 tháng. Sau đó em dùng Genetic Algorithm để chọn 12 features và so sánh Naïve Bayes với Random Forest. Trong kết quả đã báo cáo, Random Forest đạt 78,1% Accuracy so với 61,3% của Naïve Bayes. Nếu anh/chị muốn hỏi sâu, em có thể trao đổi kỹ về missing values, regex, outlier, data leakage và tại sao việc chọn features phải tách khỏi test set ạ."},{"type":"speech","text":"Theo em, kết quả model cũng phải gắn với rủi ro nghiệp vụ. Ví dụ giả định, nếu model đạt Accuracy cao nhưng vẫn bỏ sót nhiều khách hàng tín dụng xấu, việc chỉ báo cáo Accuracy sẽ dễ tạo cảm giác an toàn sai. Em sẽ xem thêm recall theo nhóm rủi ro và confusion matrix trước khi đề xuất sử dụng."}]},{"id":"s8","title":"06  HOUSING PRICE PREDICTION — ACADEMIC PROJECT","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Business → Schema/Grain → Missing/Duplicate → Encoding → Scaling/Split → LR vs RF → MAE/RMSE → App tóm tắt"},{"type":"speech","text":"Dạ, Housing Price Prediction là bài toán regression dự đoán một giá trị giá nhà từ các features như Suburb, Rooms, Distance, Landsize và BuildingArea. Phần em muốn trình bày sâu là data preprocessing: xác định Price là target, kiểm tra dữ liệu thiếu và trùng, chuyển biến danh mục sang dạng số, scaling và chia tập train/test."},{"type":"speech","text":"Ví dụ giả định, nếu BuildingArea đang bị thiếu mà em điền bằng 0 một cách máy móc, mô hình có thể hiểu căn nhà thật sự có diện tích xây dựng bằng 0. Cách xử lý phải phản ánh đúng ý nghĩa dữ liệu, không phải chỉ để model hết báo lỗi."},{"type":"speech","text":"Ví dụ, Suburb là chữ thì model không thể nhận như số diện tích; em cần encoding. Còn nếu BuildingArea thiếu, em phải xem nguyên nhân thiếu và quyết định xử lý dựa trên dữ liệu train để tránh leakage. Sau preprocessing, em so Linear Regression làm baseline với Random Forest Regressor; tài liệu ghi Random Forest tốt hơn, nhưng không có con số MAE/RMSE nên em không tự nêu. Phần ứng dụng em chỉ nói ngắn: React gửi input đến FastAPI và backend gọi mô hình để trả giá dự đoán ạ."}]},{"id":"reflection","title":"07  GÓC NHÌN CỦA EM — DATA PREPROCESSING & FEATURE ENGINEERING","items":[{"type":"meta","text":"THÔNG ĐIỆP CẦN NHỚ: Đúng nghiệp vụ trước → dữ liệu đáng tin → đặc trưng có ý nghĩa → model/KPI có thể kiểm chứng → team quyết định tốt hơn. Ví dụ dưới đây phân biệt tình huống giả định và công việc đã làm."},{"type":"h2","text":"Bài nói 90–120 giây — sau khi trình bày các dự án"},{"type":"speech","text":"Dạ, sau những dự án em làm, theo em Data Preprocessing và Feature Engineering không phải chỉ là hai bước kỹ thuật để model chạy được. Đây là phần quyết định dữ liệu có phản ánh đúng nghiệp vụ và có thể sử dụng để ra quyết định hay không."},{"type":"speech","text":"Em lấy ví dụ ở Talent Mobility. Khi kiểm tra bảng yêu cầu kỹ năng, em thấy Team và Role lặp lại. Nếu em vội xóa những dòng đó vì tưởng duplicate thì có thể xóa mất một skill hợp lệ. Khi đó dữ liệu nhìn gọn hơn nhưng điểm matching lại sai. Nên với em, preprocessing tốt là phải hiểu một dòng đại diện cho điều gì trước khi xử lý."},{"type":"speech","text":"Còn Feature Engineering giúp chuyển thông tin thô thành một cách biểu diễn có ý nghĩa hơn. Ví dụ trong Credit Score, em chuyển Credit History Age từ 5 năm 3 tháng thành 63 tháng. Sau đó em mới lựa chọn features và so sánh mô hình. Em thấy hai bước này nối tiếp nhau: dữ liệu sạch mà feature không phù hợp thì model vẫn có thể học chưa tốt; nhưng feature hay đến đâu mà dữ liệu đầu vào sai thì kết quả cũng khó đáng tin."},{"type":"speech","text":"Điều đó càng quan trọng khi kết quả được team sử dụng. Ví dụ với S2T, nếu khách hàng nói 21 triệu nhưng transcript ghi 211 triệu thì NER có thể trích đúng từ transcript nhưng thông tin cuối cùng vẫn sai. Em nghĩ mình phải truy đúng nguồn lỗi trước khi sửa, chứ không chỉ nhìn một metric tổng."},{"type":"speech","text":"Tóm lại, điều em rút ra là trước khi chọn một model phức tạp hơn, em muốn chắc rằng dữ liệu được xử lý đúng, những features hoặc KPI có ý nghĩa và kết quả đã được kiểm chứng. Khi đó, phần phân tích mới thực sự hỗ trợ team đưa ra quyết định tốt hơn ạ."},{"type":"h2","text":"Một câu chốt 15 giây — nếu không còn nhiều thời gian"},{"type":"speech","text":"Dạ, theo em, dữ liệu đầu vào quyết định chất lượng của những bước sau. Ví dụ chỉ cần xóa nhầm một skill trong Talent Mobility là điểm matching có thể sai, hoặc nhận nhầm 21 triệu thành 211 triệu trong S2T là thông tin nghiệp vụ đã khác hoàn toàn. Nên em luôn ưu tiên hiểu dữ liệu, kiểm chứng preprocessing rồi mới tin vào kết quả cuối cùng ạ."}]},{"id":"s9","title":"Câu chốt khi được hỏi thêm","items":[{"type":"speech","text":"Dạ, đó là phần chính em đã làm. Nếu anh/chị muốn đi sâu hơn, em có thể trao đổi kỹ về cách xử lý dữ liệu, lý do chọn phương pháp hoặc cách em đánh giá kết quả của từng bước ạ."}]}]},"deep":{"title":"SCRIPT PHỎNG VẤN — CHUYÊN SÂU DATA PREPROCESSING","sections":[{"id":"intro","title":"Giới thiệu & hướng dẫn","items":[{"type":"normal","text":"Data/BI Analyst Officer  +  Data Scientist Executive"},{"type":"meta","text":"Ưu tiên Data Profiling, Cleaning, Validation, Feature Engineering và Model Evaluation; frontend/backend ở mức tổng quan."}]},{"id":"s1","title":"Cách dùng trong thời gian ngắn","items":[{"type":"speech","text":"Mỗi dự án có một bài nói chính khoảng 60–120 giây và các câu hỏi đào sâu. Em không cần học thuộc từng chữ. Chỉ cần nhớ chuỗi: Vấn đề → Em làm gì → Dùng công nghệ nào, như thế nào → Khó khăn → Kết quả → Giúp team ra sao."},{"type":"speech","text":"Khi trả lời, hãy ưu tiên 1 ví dụ cụ thể hơn là liệt kê 5 công nghệ. Nếu không nhớ số liệu, nói đúng ý nghĩa kết quả; không tự tạo KPI. Các câu “Dạ, theo cách em hiểu…” hay “Trong phần em trực tiếp tham gia…” giúp câu trả lời tự nhiên và rõ phạm vi đóng góp."}]},{"id":"s2","title":"A. MỞ ĐẦU — GIỚI THIỆU BẢN THÂN","items":[{"type":"h2","text":"Bài nói khoảng 60 giây"},{"type":"speech","text":"Dạ em chào anh/chị. Em học Computer Science theo hướng Data Science. Trong quá trình học và đi làm, em tập trung vào việc xử lý dữ liệu, phân tích kết quả và ứng dụng Machine Learning vào những bài toán cụ thể. Trước đây em làm Data Analyst ở MWG, chủ yếu chuẩn bị dữ liệu và báo cáo về đánh giá khách hàng, chất lượng phục vụ cửa hàng. Hiện tại em làm các công việc liên quan đến Data và AI/ML tại Daiichi Life Việt Nam, trong đó có đánh giá hệ thống nhận dạng cuộc gọi, phân tích log của AI service và một dự án phân tích năng lực phục vụ luân chuyển nhân sự. Ngoài ra, em có hai dự án cá nhân về Credit Score Prediction và Housing Price Prediction để rèn thêm phần Machine Learning. Điểm em chú trọng là hiểu vấn đề nghiệp vụ trước, sau đó mới chọn công cụ, kiểm tra chất lượng dữ liệu và đánh giá kết quả có thực sự hữu ích hay không."},{"type":"h2","text":"Nếu phỏng vấn nghiêng về Data/BI Analyst"},{"type":"speech","text":"Dạ, nếu nhìn theo góc độ Data/BI Analyst, phần em mạnh nhất là đi từ dữ liệu thô đến báo cáo có thể sử dụng. Chẳng hạn ở MWG em lấy dữ liệu trên hệ thống nội bộ, dùng Python xử lý rồi tổng hợp thành báo cáo Excel để team theo dõi các chỉ số chất lượng phục vụ. Ở Daiichi Life, em cũng làm việc với dữ liệu log và kiểm tra chất lượng dữ liệu đầu vào cho các bài toán phân tích. Em hiểu là một dashboard hay một chỉ số chỉ có giá trị khi định nghĩa KPI rõ, số liệu đáng tin và người sử dụng biết cần làm gì tiếp theo."},{"type":"h2","text":"Nếu phỏng vấn nghiêng về Data Scientist"},{"type":"speech","text":"Dạ, theo hướng Data Scientist, em có kinh nghiệm ở cả phần chuẩn bị dữ liệu và đánh giá mô hình. Với Credit Score, em xử lý dữ liệu tài chính, tạo và chọn features rồi so sánh các mô hình classification. Với Housing Price, em thử regression models và học cách chuẩn bị dữ liệu, so sánh regression models. Còn tại Daiichi Life, em có trải nghiệm thực tế về benchmark AI models, phân tích lỗi và kiểm chứng cải thiện qua nhiều tập kiểm thử. Em chưa xem việc một metric đẹp hơn là đủ; em muốn hiểu lỗi nào được sửa, lỗi nào phát sinh thêm và tác động đến nghiệp vụ như thế nào."},{"type":"speech","text":"Ví dụ trực tiếp từ dự án S2T là có trường hợp model nhận dạng sai ‘21 triệu’ thành ‘211 triệu’. Nếu em chỉ nhìn WER mà không kiểm tra số tiền, em có thể đánh giá thấp tác động của lỗi. Đó là lý do em luôn cố gắng nối metric kỹ thuật với thông tin nghiệp vụ."},{"type":"h2","text":"Câu trả lời cốt lõi — Nếu anh/chị hỏi em tiếp cận dữ liệu mới thế nào?"},{"type":"speech","text":"Dạ, nếu anh/chị hỏi em tiếp cận một dataset mới ra sao, em sẽ không làm sạch ngay. Đầu tiên em hỏi mục tiêu phân tích là gì và một dòng dữ liệu đại diện cho điều gì. Tiếp đó em làm data profiling: xem schema, tỷ lệ missing, phân bố, giá trị bất hợp lý, khóa trùng và phân bố target nếu là ML. Sau khi hiểu nguyên nhân, em mới chọn cách cleaning như parse text thành numeric, xử lý missing, duplicate hay outlier theo business rules. Nếu là bài toán ML, em tránh để test ảnh hưởng đến imputation, scaling và feature selection. Cuối cùng em validation lại số dòng, kiểu dữ liệu, tỷ lệ missing, phân bố và kết quả trên tập đánh giá. Em nghĩ preprocessing tốt là khi dữ liệu không chỉ chạy được mà còn đúng về nghiệp vụ và kiểm chứng được ạ."},{"type":"speech","text":"Ví dụ ở Talent Mobility, Team và Role xuất hiện nhiều lần chưa chắc là lỗi, vì mỗi dòng có thể tương ứng một skill khác nhau. Nếu xóa những dòng đó ngay, em sẽ làm mất thông tin quan trọng trước khi tính readiness. Đây là ví dụ cho việc dữ liệu có thể sạch về hình thức nhưng sai về nghiệp vụ."}]},{"id":"s3","title":"01  CALL TRANSCRIPTION & SPEECH ANALYTICS — DAIICHI LIFE","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Vấn đề cuộc gọi → Survey → Benchmark → RCA → Prompt → Regression Test → Giá trị cho team"},{"type":"h2","text":"Bài nói chính — giọng trao đổi với interviewer"},{"type":"speech","text":"Dạ, dự án này xuất phát từ nhu cầu biến nội dung cuộc gọi tổng đài thành dữ liệu đáng tin cậy để phục vụ kiểm tra chất lượng và phân tích. Nếu audio chỉ được lưu dưới dạng ghi âm thì việc tìm kiếm hoặc trích xuất những thông tin như số tiền, tên hay mã hợp đồng sẽ rất khó tự động hóa. Trong pipeline, S2T chuyển audio thành transcript, còn NER lấy thông tin quan trọng từ transcript đó."},{"type":"speech","text":"Phần em tham gia bắt đầu từ việc khảo sát các mô hình và API. Em xây dựng bộ tiêu chí có trọng số để đánh giá ứng viên, vì em nghĩ không thể chỉ chọn một mô hình dựa trên độ chính xác chung: với dữ liệu bảo hiểm còn phải quan tâm đến thông tin quan trọng, tốc độ, chi phí, quyền riêng tư và khả năng triển khai. Sau đó, em dùng Python xây dựng framework benchmark có thể thay mô hình và chạy trên cùng một bộ 80 audio với transcript chuẩn, đo các chỉ số như WER, CER và RTF. Em cũng thử VAD, segmentation và một số cấu hình inference cho audio dài."},{"type":"speech","text":"Ví dụ, nếu một model đạt WER thấp nhưng thường nhầm số tiền, còn model khác có WER nhỉnh hơn nhưng nhận dạng số tiền tốt và xử lý nhanh, em sẽ đưa những trade-off đó vào bảng đánh giá để team cân nhắc theo use case."},{"type":"speech","text":"Khi phân tích những trường hợp sai, em đối chiếu transcript AI với ground truth, rồi đối chiếu entities được trích xuất với chính transcript AI. Nhờ vậy, team có thể xác định lỗi bắt đầu từ nhận dạng giọng nói hay từ bước trích xuất. Từ kết quả RCA, em tối ưu hướng dẫn prompt và chạy regression testing để kiểm tra xem lỗi mục tiêu cải thiện nhưng các trường hợp khác có bị xấu đi không."},{"type":"speech","text":"Trên một tập kiểm thử Q3, WER giảm từ 14,35% xuống 10,84% và Perfect Rate tăng từ 34,57% lên 44,79%. Tuy nhiên, em cũng ghi nhận một tập khác có regression, nên em không xem đây là cải thiện đồng đều của toàn bộ hệ thống. Đóng góp em thấy rõ nhất là giúp team có cách đánh giá lặp lại được và có bằng chứng cụ thể để ưu tiên đúng nhóm lỗi cần sửa."},{"type":"speech","text":"Ví dụ để hình dung, nếu em sửa một prompt để các trường hợp số tiền trong tập Q3 chính xác hơn nhưng trên tập `bad` lại phát sinh thêm lỗi, em phải kiểm tra phạm vi regression trước khi khẳng định phiên bản mới tốt hơn. Đây là lý do em muốn kết quả được báo cáo theo từng dataset."},{"type":"h2","text":"Cách em sử dụng kỹ thuật — theo từng bước"},{"type":"h3","text":"Data Preprocessing 1 — Chuẩn bị audio đúng định dạng"},{"type":"speech","text":"Dạ với audio, preprocessing không phải chỉ sửa text hay missing values. Trước hết em phải chuẩn bị tín hiệu đầu vào sao cho model nhận được. Trong bài benchmark, em có bước chuyển đổi audio nguồn từ GSM 8 kHz sang PCM 16 kHz, đồng thời ghép đúng audio với transcript ground truth. Em phải hiểu rõ rằng đổi sample rate không tạo thêm thông tin giọng nói đã mất; mục đích là đáp ứng yêu cầu input của pipeline. Nếu lệch file audio và ground truth thì toàn bộ WER phía sau sẽ sai."},{"type":"h3","text":"Data Preprocessing 2 — VAD, segmentation và chuẩn hóa text"},{"type":"speech","text":"Dạ VAD phát hiện đoạn có tiếng nói, còn segmentation chia audio dài thành các đoạn để inference. Em thử nhiều cấu hình vì nếu cắt quá sát thì từ đầu hoặc cuối câu có thể bị mất, làm WER xấu đi. Với transcript, em cần áp dụng cùng quy tắc chuẩn hóa trước khi so sánh, chẳng hạn dấu câu, khoảng trắng và cách viết số, nếu metric cho phép. Em phân biệt phần text normalization dùng để đánh giá với việc tự sửa nội dung mà audio không hề nói."},{"type":"h3","text":"Data Validation 3 — Ghép transcript, entities và root cause"},{"type":"speech","text":"Dạ sau inference, em kiểm tra transcript AI so với ground truth để xác định lỗi nhận dạng, rồi so entities với chính transcript AI để xác định lỗi trích xuất. Ví dụ audio nói 21 triệu mà transcript ghi 211 triệu, NER trích 211 triệu thì NER đã bám đầu vào nhưng lỗi bắt đầu từ S2T. Kiểm tra data lineage như vậy giúp team ưu tiên đúng bước cần xử lý."},{"type":"h2","text":"Nếu anh/chị hỏi sâu"},{"type":"question","text":"Anh/chị hỏi: Tại sao em không chỉ chọn model có WER thấp nhất?"},{"type":"speech","text":"Dạ, vì WER chỉ phản ánh mức sai khác của transcript theo từ. Trong bảo hiểm, một transcript có thể sai rất ít từ nhưng lại sai đúng số tiền hoặc mã hợp đồng, như vậy tác động nghiệp vụ khá lớn. Em sẽ nhìn thêm độ đúng các entity quan trọng, tốc độ xử lý, chi phí, bảo mật và yêu cầu triển khai rồi mới đề xuất ứng viên phù hợp."},{"type":"question","text":"Anh/chị hỏi: WER, CER và RTF là gì?"},{"type":"speech","text":"Dạ, WER đo số lỗi thay từ, thiếu từ và thêm từ so với tổng số từ của transcript chuẩn; CER tương tự nhưng tính ở mức ký tự. Còn RTF là thời gian xử lý chia cho thời lượng audio. Ví dụ xử lý audio 100 giây trong 10 giây thì RTF bằng 0,1. WER/CER nói về chất lượng, RTF nói về tốc độ."},{"type":"question","text":"Anh/chị hỏi: VAD có phải lúc nào cũng tốt?"},{"type":"speech","text":"Dạ không ạ. VAD giúp xác định vùng có lời nói và hỗ trợ xử lý audio dài, nhưng nếu cắt nhầm ở đầu hoặc cuối câu thì có thể làm mất từ và khiến WER tăng. Vì vậy em thử cấu hình rồi đo lại trên cùng tập đánh giá, chứ không mặc định có VAD là tốt hơn."},{"type":"question","text":"Anh/chị hỏi: Làm sao em biết lỗi do S2T hay NER?"},{"type":"speech","text":"Dạ em kiểm tra theo hai quan hệ khác nhau. Transcript AI được đối chiếu với ground truth để biết nhận dạng có sai không; entities được đối chiếu với transcript AI để biết bước trích xuất có đúng với đầu vào của nó không. Ví dụ audio nói 21 triệu nhưng S2T ghi 211 triệu, NER trích 211 triệu thì lỗi khởi đầu là S2T, không nên vội quy trách nhiệm cho NER."},{"type":"question","text":"Anh/chị hỏi: Em có fine-tune weights của LLM không?"},{"type":"speech","text":"Dạ, với nhánh tối ưu em đang trình bày, công việc chủ yếu là prompt optimization, business rules và regression testing; tức em điều chỉnh hướng dẫn và kiểm tra đầu ra. Em sẽ phân biệt phần này với fine-tuning đúng nghĩa là cập nhật trọng số mô hình, để tránh dùng sai thuật ngữ."},{"type":"question","text":"Anh/chị hỏi: Điểm em học được nhất?"},{"type":"speech","text":"Dạ, em học được rằng không nên tối ưu dựa trên một chỉ số hoặc một tập test. Một thay đổi có thể làm tốt tập lỗi mục tiêu nhưng gây regression ở nhóm khác. Vì vậy em ưu tiên đo lường nhất quán, phân tích root cause và báo cáo cả kết quả chưa tốt."},{"type":"question","text":"Anh/chị hỏi: Nếu transcript sai do cách viết số thì preprocessing nên làm gì?"},{"type":"speech","text":"Dạ em phải thống nhất quy tắc normalization và đánh giá thêm entity-level correctness. Ví dụ '21 triệu' và '21000000' có thể mang cùng giá trị nhưng khác cách viết. Tuy nhiên em không tự ý sửa sai số tiền dựa trên ground truth trong dữ liệu đầu vào, vì như vậy sẽ làm metric bị lạc quan và che mất lỗi thật."},{"type":"meta","text":"GHI NHỚ  Không nói dashboard Call Intelligence đã chạy production; không nói chỉ số Q3 là hiệu quả chung toàn hệ thống; không nhầm prompt optimization với fine-tuning model weights."}]},{"id":"s4","title":"02  AI SERVICE LOG ANALYTICS — DAIICHI LIFE","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Log khó đọc → Db2 / SQL → Python parse → Dữ liệu có cấu trúc → Usage & concurrency → Team monitoring"},{"type":"h2","text":"Bài nói chính — giọng trao đổi với interviewer"},{"type":"speech","text":"Dạ, với bài toán AI Service Analytics, vấn đề ban đầu là dữ liệu vận hành nằm trong các bản ghi log, và một phần thông tin được chứa chung trong một cột nên chưa thuận tiện cho việc phân tích. Mục tiêu của em là chuyển nguồn dữ liệu kỹ thuật này thành dữ liệu có cấu trúc để team có thể theo dõi hoạt động dịch vụ."},{"type":"speech","text":"Cách em làm là truy vấn dữ liệu từ bảng OCR staging trên IBM Db2 bằng SQL. Sau đó, em dùng Python để parse nội dung log, tách các trường cần thiết thành từng cột và chuẩn bị dữ liệu để phân tích. Trên dữ liệu này, em tập trung vào các chỉ số như số request theo ngày, tháng, năm và mức độ hoạt động đồng thời."},{"type":"speech","text":"Em chọn kết hợp SQL và Python vì SQL phù hợp cho việc lấy dữ liệu nguồn theo điều kiện, còn Python linh hoạt hơn khi cần tách log bán cấu trúc và xử lý định dạng phức tạp. Giá trị đối với team là không phải nhìn từng dòng log thô, mà có thể xem các xu hướng sử dụng để hỗ trợ việc theo dõi hoạt động AI service."},{"type":"h2","text":"Cách em sử dụng kỹ thuật — theo từng bước"},{"type":"h3","text":"Data Preprocessing 1 — Extract và xác định grain"},{"type":"speech","text":"Dạ em dùng SQL lấy log từ OCR staging trong Db2. Trước khi parse, em cần xác định một dòng log tương ứng một request, một event hay một phần của request. Nếu một request có nhiều events thì không thể đếm số dòng thành Total Requests. Em sẽ đối chiếu request ID hoặc event type nếu nguồn có cung cấp. Đây là nguyên tắc em cần làm rõ khi xây KPI."},{"type":"h3","text":"Data Preprocessing 2 — Parse và xử lý bản ghi lỗi"},{"type":"speech","text":"Dạ Python phù hợp khi thông tin còn nằm trong một cột log bán cấu trúc. Ví dụ minh họa một log ghi request_id, timestamp, service, status trên cùng một chuỗi; em tách thành cột rồi chuyển timestamp về kiểu datetime, status về định dạng nhất quán. Nếu một log thiếu trường thì không nên âm thầm bỏ qua; em muốn giữ dấu vết bản ghi không parse được để kiểm tra tỷ lệ lỗi."},{"type":"speech","text":"Ví dụ giả định, log A bắt đầu lúc 10:00:00 và kết thúc lúc 10:00:30; log B bắt đầu lúc 10:00:15 và kết thúc lúc 10:00:40. Trong 15 giây giao nhau có hai request đồng thời. Nếu chỉ đếm ‘hai request trong cùng một phút’, em chưa thể kết luận concurrency chính xác."},{"type":"h3","text":"Data Validation 3 — Đối soát trước/sau"},{"type":"speech","text":"Dạ khi làm xong em sẽ so row count trước và sau, số record thành công/thất bại, khóa trùng và thống kê null theo từng trường. Với dữ liệu theo thời gian, cần chú ý timezone và định nghĩa khoảng ngày. Chỉ khi dữ liệu đã được kiểm tra em mới tính KPI request và concurrency; nếu không thì dashboard có đẹp cũng không đáng tin."},{"type":"h2","text":"Nếu anh/chị hỏi sâu"},{"type":"question","text":"Anh/chị hỏi: Vì sao không xử lý tất cả bằng SQL?"},{"type":"speech","text":"Dạ SQL có thể xử lý rất nhiều tác vụ, và nếu dữ liệu đã cấu trúc rõ thì em ưu tiên tận dụng database. Nhưng với dạng log cần parse nhiều thuộc tính từ một trường, Python giúp em viết logic tách trường, xử lý ngoại lệ và kiểm thử linh hoạt hơn. Còn lựa chọn tốt nhất vẫn phụ thuộc khối lượng dữ liệu và khả năng của hệ quản trị."},{"type":"question","text":"Anh/chị hỏi: Làm sao xác nhận dữ liệu parse đúng?"},{"type":"speech","text":"Dạ em sẽ đối chiếu số bản ghi trước và sau, kiểm tra tỷ lệ parse thành công, schema, kiểu dữ liệu và chọn một số log gốc để so sánh với các cột đã tách. Nếu có trường bị thiếu hoặc format bất thường, em sẽ ghi nhận riêng thay vì âm thầm bỏ qua."},{"type":"question","text":"Anh/chị hỏi: Concurrent users khác request count thế nào?"},{"type":"speech","text":"Dạ số request trong một phút chỉ cho thấy lưu lượng trong phút đó, chưa chắc có bao nhiêu request đang xử lý cùng lúc. Muốn tính concurrency chính xác thì cần định nghĩa rõ hoạt động đồng thời và có dữ liệu thời điểm bắt đầu, kết thúc, hoặc tín hiệu trạng thái phù hợp."},{"type":"question","text":"Anh/chị hỏi: Nếu request tăng đột biến thì em phân tích thế nào?"},{"type":"speech","text":"Dạ trước tiên em kiểm tra có phải lỗi dữ liệu hoặc duplicate không. Sau đó em phân tách theo thời gian và service, đối chiếu baseline. Nếu có thêm latency hoặc error logs thì em kiểm tra tiếp để xem đây là tăng nhu cầu bình thường hay dấu hiệu bất thường."},{"type":"question","text":"Anh/chị hỏi: Một request có ba log thì em tránh đếm ba lần thế nào?"},{"type":"speech","text":"Dạ trước tiên phải xác định data grain: log event khác request. Nếu có request_id, em có thể đếm distinct request_id cho Total Requests, nhưng vẫn giữ các event để điều tra. Đây là ví dụ tình huống; em cần xác nhận cấu trúc khóa thực tế của nguồn trước khi áp dụng."},{"type":"meta","text":"GHI NHỚ  Chưa có số liệu xác nhận tiết kiệm thời gian hoặc giảm chi phí vận hành; không tự nhận đã xây monitoring production đầy đủ."}]},{"id":"s5","title":"03  TALENT MOBILITY & WORKFORCE ANALYTICS — DAIICHI LIFE","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Luân chuyển nhân sự → Data quality → Grain / duplicate → Two-table model → Skill gap & matching → Team decision support"},{"type":"h2","text":"Bài nói chính — giọng trao đổi với interviewer"},{"type":"speech","text":"Dạ, dự án Talent Mobility hướng tới việc hỗ trợ team xem một nhân viên có thể phù hợp với những vị trí nào trong các Agile Teams khác, dựa trên năng lực hiện tại và yêu cầu kỹ năng của vị trí mục tiêu. Đầu ra mong muốn không phải tự quyết định ai được luân chuyển, mà là cung cấp dữ liệu và điểm đánh giá để quản lý tham khảo."},{"type":"speech","text":"Phần em tập trung khá nhiều là data quality và cấu trúc dữ liệu. Ban đầu có nhiều bảng và có hiện tượng lặp Team, Role. Em dùng Power Query để group và kiểm tra nhưng em không xóa ngay, vì một role có nhiều skills thì việc Team và Role lặp lại là hoàn toàn hợp lệ. Em phải xem một dòng đang đại diện cho điều gì, tức data grain, và xác định tổ hợp khóa nghiệp vụ trước khi loại duplicate thực sự."},{"type":"speech","text":"Sau đó em tổ chức pipeline theo hai bảng chính, sử dụng Python để tính các chỉ số như role similarity, skill gap, readiness và candidate matching theo business rules. Kết quả được thể hiện trên giao diện demo để dễ lọc theo team hoặc role. Điều em muốn đóng góp cho team là dữ liệu sạch hơn, cách scoring nhất quán hơn và khả năng thấy rõ vì sao một người phù hợp hoặc còn thiếu kỹ năng nào."},{"type":"speech","text":"Ví dụ giả định, một role yêu cầu SQL level 4 và Python level 3. Một nhân viên có SQL level 4 nhưng Python level 1 thì em muốn kết quả nêu rõ gap Python bằng 2 cấp, thay vì chỉ đưa ra một điểm matching chung. Team có thể dựa vào đó để thảo luận hướng đào tạo phù hợp."},{"type":"h2","text":"Cách em sử dụng kỹ thuật — theo từng bước"},{"type":"h3","text":"Data Preprocessing 1 — Grain và business key"},{"type":"speech","text":"Dạ vấn đề nổi bật nhất là thấy Team và Role bị lặp, nhưng em không coi đó là duplicate ngay. Em hiểu một dòng trong Role Skill Master có thể là một kỹ năng của một role trong một team. Ví dụ cùng role Data Analyst có SQL và Python thì đó là hai yêu cầu hợp lệ; chỉ khi cùng tổ hợp khóa và các thuộc tính nghiệp vụ lặp không cần thiết mới xem xét loại bản ghi."},{"type":"h3","text":"Data Preprocessing 2 — Validate trước scoring"},{"type":"speech","text":"Dạ em kiểm tra Skill Code, Required Level, assessment và các trường ánh xạ. Ví dụ mức yêu cầu của kỹ năng là 4 nhưng assessment bị trống, em không được mặc định năng lực bằng 0 nếu quy tắc nghiệp vụ chưa nói như vậy. Em cần phân biệt 'chưa được đánh giá' với 'đã đánh giá và chưa đạt'. Việc này quan trọng vì nó ảnh hưởng trực tiếp Skill Gap và Readiness."},{"type":"h3","text":"Feature Derivation 3 — Từ dữ liệu sạch đến điểm phù hợp"},{"type":"speech","text":"Dạ sau khi xác định đúng dữ liệu, em mới tính các derived measures như skill gap, role similarity, readiness hoặc candidate match theo logic định sẵn. Ví dụ minh họa role yêu cầu SQL mức 4, nhân viên được đánh giá mức 3 thì gap là 1 theo định nghĩa đơn giản. Nếu có trọng số cho kỹ năng quan trọng, điểm tổng hợp sẽ thay đổi, nên cần đối chiếu với business owner."},{"type":"h2","text":"Nếu anh/chị hỏi sâu"},{"type":"question","text":"Anh/chị hỏi: Data grain là gì? Em áp dụng thế nào?"},{"type":"speech","text":"Dạ, data grain là ý nghĩa của một dòng dữ liệu. Ví dụ trong Role Skill Master, một dòng có thể là một kỹ năng được yêu cầu cho một role trong một team. Khi đó Team và Role lặp lại chưa phải lỗi, vì mỗi dòng là một skill khác nhau. Em chỉ xử lý duplicate sau khi xác định đúng grain."},{"type":"question","text":"Anh/chị hỏi: Skill gap và readiness khác nhau thế nào?"},{"type":"speech","text":"Dạ skill gap thể hiện phần chênh giữa mức kỹ năng hiện tại của nhân viên với mức role yêu cầu. Readiness là cách tổng hợp mức đáp ứng của ứng viên đối với vị trí mục tiêu, có thể dùng trọng số theo kỹ năng. Vì thế, skill gap là một phần đầu vào hữu ích để tính readiness."},{"type":"question","text":"Anh/chị hỏi: Đây có phải ML không?"},{"type":"speech","text":"Dạ, phần scoring hiện tại là rule-based analytics, tức công thức và trọng số được xác định trước, không phải mô hình được train từ nhãn lịch sử. Em sẽ gọi đúng là recommendation support hoặc scoring logic, không gọi là machine learning nếu chưa thực sự huấn luyện model."},{"type":"question","text":"Anh/chị hỏi: Làm sao kiểm tra scoring có đúng?"},{"type":"speech","text":"Dạ em sẽ thử với các tình huống kiểm soát được: ứng viên đáp ứng đủ mọi kỹ năng, thiếu một kỹ năng quan trọng, hoặc nhiều kỹ năng có trọng số khác nhau. Sau đó đối chiếu tính toán thủ công, kiểm tra các trường hợp dữ liệu thiếu và hỏi business owner xem quy tắc có phản ánh đúng nhu cầu không."},{"type":"question","text":"Anh/chị hỏi: Nếu thiếu assessment score, em có điền 0 không?"},{"type":"speech","text":"Dạ em không nên tự điền 0 vì 'chưa được đánh giá' khác với 'năng lực bằng 0'. Em sẽ kiểm tra ý nghĩa dữ liệu, đề xuất giữ missing flag hoặc loại khỏi scoring tạm thời tùy business rules, rồi xác nhận với team nghiệp vụ."},{"type":"meta","text":"GHI NHỚ  Đã test trên dummy data; không khẳng định hệ thống đã được đưa vào production hoặc đã trực tiếp quyết định rotation."}]},{"id":"s6","title":"04  CUSTOMER & STORE EVALUATION — MWG","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Chất lượng phục vụ → Raw data nội bộ → Python → Excel report → So sánh KPI → Hỗ trợ team vận hành"},{"type":"h2","text":"Bài nói chính — giọng trao đổi với interviewer"},{"type":"speech","text":"Dạ, ở MWG em làm với dữ liệu đánh giá của khách hàng và chất lượng phục vụ cửa hàng. Mục tiêu chính là giúp team có số liệu tổng hợp để theo dõi những chỉ số như customer satisfaction, tỷ lệ tiếp cận khảo sát và chất lượng phục vụ, rồi so sánh giữa các chuỗi hoặc các khu vực."},{"type":"speech","text":"Quy trình thực tế của em bắt đầu bằng việc lấy raw data thủ công từ nền tảng nội bộ. Sau đó em dùng Python để xử lý dữ liệu, chuẩn bị kết quả và xuất báo cáo Excel. Khi xem báo cáo, em không chỉ nhìn một con số tổng, mà cố gắng so sánh theo thời gian, theo chuỗi bán lẻ hoặc theo vùng để thấy biến động tập trung ở đâu."},{"type":"speech","text":"Em nghĩ giá trị của công việc này là giúp team bớt phải làm việc trực tiếp trên dữ liệu thô và có báo cáo nhất quán hơn cho các buổi review vận hành. Nếu một KPI giảm, số liệu đó là điểm bắt đầu để team kiểm tra thêm chứ chưa đủ để khẳng định ngay nguyên nhân."},{"type":"speech","text":"Ví dụ giả định, KPI hài lòng của một khu vực giảm nhưng số phản hồi tháng này chỉ bằng một phần nhỏ tháng trước. Nếu chỉ nhìn phần trăm, manager có thể hiểu sai tình hình. Em sẽ kiểm tra mẫu số và chia theo chuỗi, vùng, nguồn khảo sát trước khi đề xuất một hướng kiểm tra."},{"type":"h2","text":"Cách em sử dụng kỹ thuật — theo từng bước"},{"type":"h3","text":"Data Preprocessing 1 — Chuẩn bị báo cáo nhiều nhóm"},{"type":"speech","text":"Dạ em tải raw data từ nền tảng nội bộ rồi dùng Python để chuẩn bị dữ liệu cho báo cáo Excel. Muốn báo cáo theo chuỗi và khu vực đáng tin, trước tiên phải kiểm tra kỳ báo cáo, định dạng trường, số bản ghi và ý nghĩa mã chuỗi/cửa hàng. Ví dụ nếu cùng một chuỗi bị ghi hai cách tên, lúc group theo chuỗi có thể tách sai kết quả."},{"type":"h3","text":"Data Validation 2 — Định nghĩa mẫu số cho KPI"},{"type":"speech","text":"Dạ điểm quan trọng không chỉ là dùng groupby mà là thống nhất công thức KPI. Ví dụ minh họa nếu có 100 khách hàng đủ điều kiện khảo sát và 60 người được liên hệ thành công thì survey reach rate là 60%, với điều kiện mẫu số và khái niệm 'liên hệ thành công' đã được thống nhất. Nếu mỗi tháng định nghĩa khác nhau, so sánh MoM sẽ sai."},{"type":"h3","text":"Feature/KPI Engineering 3 — Tổng hợp và so sánh"},{"type":"speech","text":"Dạ em xem phân tích theo chuỗi, khu vực, thời gian và nhóm feedback là quá trình tạo KPI/derived metrics cho BI. Ví dụ tỷ lệ hài lòng tháng 5 là 70%, tháng 6 là 72% thì tăng 2 điểm phần trăm, không phải tăng 2%. Nếu có nhóm 10 phiếu và nhóm 1.000 phiếu, em cũng cần cân nhắc weighted average theo đúng mẫu số chứ không lấy trung bình hai tỷ lệ một cách máy móc."},{"type":"h2","text":"Nếu anh/chị hỏi sâu"},{"type":"question","text":"Anh/chị hỏi: Nếu CSAT của một khu vực giảm thì em làm gì?"},{"type":"speech","text":"Dạ đầu tiên em kiểm tra dữ liệu giữa hai kỳ có cùng định nghĩa và đủ mẫu khảo sát không. Sau đó em breakdown theo chuỗi, khu vực, cửa hàng và nhóm phản hồi. Nếu có một nhóm giảm mạnh, em sẽ đưa ra giả thuyết và đề xuất kiểm tra hoạt động thực tế, chứ chưa vội kết luận từ tương quan."},{"type":"question","text":"Anh/chị hỏi: Vì sao dùng Python rồi vẫn xuất Excel?"},{"type":"speech","text":"Dạ Python giúp xử lý dữ liệu và lặp lại các bước chuyển đổi dễ hơn, còn Excel là định dạng team có thể mở và sử dụng ngay trong báo cáo vận hành. Việc chọn đầu ra phụ thuộc người dùng cuối, không nhất thiết công cụ kỹ thuật phức tạp hơn sẽ tốt hơn."},{"type":"question","text":"Anh/chị hỏi: Em có dùng Power BI cho đúng báo cáo này không?"},{"type":"speech","text":"Dạ, với workflow em đang mô tả, phần chắc chắn là dữ liệu lấy trên nền tảng nội bộ, xử lý bằng Python và báo cáo cuối ở Excel. Em muốn phân biệt đúng từng nhiệm vụ thay vì gộp tất cả công cụ em từng sử dụng vào một báo cáo."},{"type":"speech","text":"Ví dụ, nếu em đã làm báo cáo Excel từ dữ liệu xử lý bằng Python, em sẽ nói đúng phần đó. Em không nên nói em đã xây dựng dashboard Power BI cho chính báo cáo ấy chỉ vì Power BI cũng là một công cụ em biết dùng. Cách nói rõ phạm vi giúp interviewer đánh giá đúng kinh nghiệm của em."},{"type":"question","text":"Anh/chị hỏi: Month-over-month tăng 2 điểm phần trăm khác tăng 2% thế nào?"},{"type":"speech","text":"Dạ nếu KPI tăng từ 70% lên 72% thì chênh lệch là 2 điểm phần trăm. Còn mức tăng tương đối là 2 chia 70, khoảng 2,86%. Trong báo cáo em phải nói rõ loại thay đổi nào đang được dùng để tránh gây hiểu nhầm."},{"type":"question","text":"Anh/chị hỏi: Nếu KPI tháng này tăng nhưng số mẫu giảm mạnh thì sao?"},{"type":"speech","text":"Dạ em kiểm tra số mẫu, tỷ lệ tiếp cận và sự khác biệt của nhóm khảo sát. KPI tăng chưa chắc chất lượng cải thiện thực sự; có thể do thành phần khách hàng thay đổi. Em sẽ báo cáo mức tăng kèm sample size và phân tích phân khúc để team diễn giải đúng."},{"type":"meta","text":"GHI NHỚ  Không tuyên bố đã giúp tăng CSAT trực tiếp nếu chưa có thử nghiệm hoặc đo hiệu quả can thiệp."}]},{"id":"s7","title":"05  CREDIT SCORE PREDICTION — INDEPENDENT PROJECT","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Business → Data profiling → Cleaning/regex → Missing/Outliers → Total_CHA → GA 12 features → Train/Test → RF vs NB → Metrics"},{"type":"h2","text":"Bài nói chính — giọng trao đổi với interviewer"},{"type":"speech","text":"Dạ, Credit Score Prediction là dự án classification em thực hiện trên hơn 100.000 bản ghi tài chính, với mục tiêu dự đoán nhóm mức tín nhiệm. Em muốn giải quyết từ đầu vấn đề dữ liệu chất lượng chưa ổn trước khi nói đến chọn model, vì nếu kiểu dữ liệu và giá trị đầu vào sai thì kết quả model khó đáng tin."},{"type":"speech","text":"Ví dụ giả định, một cột Income có giá trị ‘45,000’ ở dạng chuỗi và một vài dòng chứa ‘-2000’. Nếu em bỏ qua thì một số thuật toán có thể không nhận kiểu dữ liệu, hoặc dữ liệu âm làm mô hình học một tín hiệu sai. Em phải tách việc chuẩn hóa format khỏi việc quyết định giá trị nào không hợp lệ."},{"type":"speech","text":"Trong KNIME em xây một workflow từ kiểm tra dữ liệu đến modeling. Em xem schema và giá trị của các cột, loại thuộc tính không phù hợp như Name, xử lý các trường hợp không hợp lệ như income âm hoặc số đếm âm, rồi dùng regex để chuẩn hóa cột số chứa ký tự đặc biệt và chuyển về numeric. Với missing values hay outliers, em không nghĩ có quy tắc xóa hoặc điền chung cho mọi cột; cần xem nguyên nhân thiếu, phân bố và ý nghĩa nghiệp vụ."},{"type":"speech","text":"Sau cleaning, em tập trung vào feature engineering. Ví dụ Credit History Age là 5 năm 3 tháng thì em đưa về Total_CHA = 63 tháng để biểu diễn nhất quán. Em cũng xử lý Loan Type cho phù hợp. Sau đó, em dùng Genetic Algorithm để chọn 12 features. Em phân biệt rõ hai việc: biến đổi thông tin thành thuộc tính hữu ích hơn là feature engineering, còn chọn ra những thuộc tính để dùng là feature selection."},{"type":"speech","text":"Cuối cùng em so sánh Naïve Bayes với Random Forest. Kết quả đã báo cáo là Accuracy 61,3% và 78,1%; Precision của Good Credit lần lượt là 47,7% và 71,9%. Random Forest tốt hơn theo hai chỉ số đó, nhưng chưa đủ để nói mô hình đã giảm rủi ro tín dụng. Nếu ứng dụng vào nghiệp vụ thật, em còn cần kiểm tra recall của nhóm rủi ro, confusion matrix, calibration và cách chia tập train/test để tránh leakage. Điều em học rõ nhất là phần chuẩn bị và kiểm chứng dữ liệu quyết định rất nhiều đến mức độ tin cậy của mô hình ạ."},{"type":"h2","text":"Cách em sử dụng kỹ thuật — theo từng bước"},{"type":"h3","text":"Bước 1 — Data Profiling: biết dữ liệu có gì trước khi làm sạch"},{"type":"speech","text":"Dạ em bắt đầu bằng việc xác định target là nhóm credit score, các cột đầu vào và ý nghĩa một dòng dữ liệu. Em kiểm tra schema, kiểu dữ liệu, tỷ lệ missing, giá trị min/max, phân phối nhãn và những cột có vẻ không hợp lệ. Ví dụ cột Income đáng lẽ là numeric nhưng chứa '50,000 USD' thì phải nhận biết đây là vấn đề định dạng. Nếu một khách hàng có nhiều bản ghi, em cũng phải hiểu mỗi dòng là người hay là một thời điểm, vì cách chia train/test phụ thuộc vào grain. Đây là nguyên tắc em cần kiểm tra, không tự khẳng định dataset gốc có nhiều bản ghi cùng một người."},{"type":"h3","text":"Bước 2 — Cleaning: missing values không phải lúc nào cũng điền mean"},{"type":"speech","text":"Dạ em phân biệt thiếu thật với giá trị 0 có ý nghĩa. Ví dụ một người chưa từng có khoản vay có thể không có lịch sử vay; điều đó khác với thu nhập bằng 0. Khi gặp missing em xem tỷ lệ thiếu, nguyên nhân và phân bố. Nếu một biến số lệch mạnh vì có vài người thu nhập rất cao, median thường ít bị kéo lệch hơn mean; với categorical có thể dùng mode hoặc nhãn Unknown nếu hợp lý. Nếu thiếu quá nhiều, em sẽ cân nhắc giữ missing indicator hoặc đánh giá có nên dùng biến đó nữa không. Những phương án mean/median/missing flag là cách em sẽ quyết định tùy dữ liệu, không phải khẳng định mọi cột trong dự án đã làm như vậy."},{"type":"h3","text":"Bước 3 — Cleaning: invalid values, regex và ép kiểu"},{"type":"speech","text":"Dạ em có xử lý các giá trị không hợp lý như income âm, số lượng tài khoản âm và các trường số có ký tự đặc biệt. Regex giúp tìm và thay thế theo mẫu ký tự. Ví dụ minh họa '50,000 USD' có thể chuyển thành 50000 sau khi xác nhận dấu phẩy đang dùng để ngăn hàng nghìn và đơn vị tiền là USD. Em không được chỉ xóa mọi ký tự lạ một cách mù quáng, vì '50,5' có thể là 50 phẩy 5 ở một locale khác. Sau chuẩn hóa, em cần chuyển kiểu sang numeric và kiểm tra bao nhiêu giá trị bị ép kiểu lỗi."},{"type":"h3","text":"Bước 4 — Duplicate, outlier và quy tắc nghiệp vụ"},{"type":"speech","text":"Dạ duplicate là trùng theo business key, không đơn giản là hai dòng có cùng một số giá trị. Nếu có nhiều giao dịch hợp lệ của cùng khách hàng, xóa theo customer ID có thể làm mất thông tin. Với outlier cũng vậy: thu nhập rất cao có thể là người thu nhập cao thật; còn số tài khoản -3 là invalid về nghiệp vụ. Em phân biệt giá trị không hợp lệ với giá trị hiếm nhưng hợp lệ, rồi kiểm tra tỷ lệ bản ghi bị ảnh hưởng trước khi quyết định loại hay giữ."},{"type":"h3","text":"Bước 5 — Feature Engineering: Total_CHA và Loan Type"},{"type":"speech","text":"Dạ khi dữ liệu đã sạch, em biến thông tin thành đầu vào rõ nghĩa hơn. Ví dụ Credit History Age ghi 5 năm 3 tháng, em tính 5 x 12 + 3 = 63 tháng. Cách này đưa những dạng thời gian khác nhau về cùng một đơn vị. Em cũng xử lý Loan Type cho dễ dùng trong workflow, nhưng em không tự thêm phương pháp encoding cụ thể nếu chưa mở lại KNIME xác nhận. Một hướng mở rộng có thể là tỷ lệ dư nợ/thu nhập nếu dữ liệu có đủ, nhưng đây chỉ là ví dụ đề xuất, không phải feature em khẳng định đã tạo."},{"type":"h3","text":"Bước 6 — Feature Selection: Genetic Algorithm chọn 12 biến"},{"type":"speech","text":"Dạ em hiểu Genetic Algorithm là cách tìm kiếm tập features trong nhiều tổ hợp. Có thể hình dung một ứng viên là chuỗi 0/1, 1 là giữ cột, 0 là bỏ. Thuật toán đánh giá từng tập theo fitness function, rồi lặp các thao tác selection, crossover và mutation để tìm tập tốt hơn. Kết quả em nhớ từ dự án là chọn 12 features; còn cách định nghĩa fitness, số thế hệ hoặc mutation rate phải kiểm tra workflow gốc mới nói chính xác. Về nguyên tắc, việc chọn biến phải nằm trong quá trình train/cross-validation, không dựa vào điểm test cuối cùng."},{"type":"h3","text":"Bước 7 — Train, Validation, Test và nguy cơ Leakage"},{"type":"speech","text":"Dạ training set dùng để model học, validation dùng để chọn tham số và so sánh cấu hình, test set là đánh giá cuối. Điều rất dễ sai là tính median để điền missing trên cả dataset rồi mới split, hoặc dùng test để chọn 12 features. Khi đó thống kê của tập test đã ảnh hưởng quá trình tạo model. Cách làm đáng tin cậy là chia dữ liệu trước khi fit những bước học từ dữ liệu, sau đó transform validation/test bằng cùng logic đã fit trên train. Với dữ liệu có thời gian hoặc nhiều records cùng khách hàng, còn phải cân nhắc split theo thời gian hoặc theo nhóm."},{"type":"h3","text":"Bước 8 — Model Training: Naïve Bayes và Random Forest"},{"type":"speech","text":"Dạ Naïve Bayes dựa trên xác suất và giả định các features độc lập có điều kiện theo nhãn. Random Forest huấn luyện nhiều cây và tổng hợp dự đoán, nên có thể học quan hệ phi tuyến tốt hơn. Em dùng hai hướng để có baseline và mô hình phức tạp hơn để đối chiếu. Muốn so sánh công bằng thì hai model cần đánh giá trên cùng tập test và quy trình preprocessing phù hợp. Em không xem model phức tạp hơn đương nhiên sẽ tốt hơn."},{"type":"h3","text":"Bước 9 — Model Evaluation gắn với nghiệp vụ"},{"type":"speech","text":"Dạ Accuracy là tỷ lệ đoán đúng tổng thể, còn Precision của Good Credit là trong các trường hợp dự đoán Good, có bao nhiêu trường hợp thực sự Good. Nếu 900 khách tốt, 100 khách rủi ro, model dự đoán ai cũng tốt vẫn đạt 90% Accuracy mà không phát hiện nhóm rủi ro nào. Đây là ví dụ giả định. Nếu triển khai thật, em sẽ quan tâm confusion matrix, recall của lớp rủi ro, calibration và chi phí mỗi loại lỗi, chứ không dừng ở một con số Accuracy."},{"type":"h3","text":"Bước 10 — Data Validation sau preprocessing"},{"type":"speech","text":"Dạ sau các bước cleaning, em muốn có một bảng kiểm tra ngắn: số dòng trước/sau, tỷ lệ missing còn lại, cột numeric có còn string lỗi không, tỷ lệ giá trị bất hợp lý, phân bố target có thay đổi nhiều không và các features có bị mất ý nghĩa không. Ví dụ nếu loại invalid làm một class hiếm giảm mạnh, em phải xem preprocessing có đang vô tình tạo bias. Đó là cách em bảo đảm cleaning không chỉ 'chạy được' mà còn giữ tính đại diện của dữ liệu."},{"type":"speech","text":"Ví dụ giả định, nếu sau cleaning số dòng giảm 5% nhưng các khách hàng thuộc nhóm tín dụng xấu giảm tới 30%, em sẽ xem lại quy tắc lọc vì mẫu train có thể đã thay đổi theo cách bất lợi. Bảng kiểm tra trước/sau giúp em phát hiện điều này."},{"type":"h2","text":"Nếu anh/chị hỏi sâu"},{"type":"question","text":"Anh/chị hỏi: Preprocessing và Feature Engineering khác nhau thế nào?"},{"type":"speech","text":"Dạ preprocessing là chuẩn bị dữ liệu cho sạch và có thể dùng được, ví dụ xử lý giá trị thiếu, loại dữ liệu âm không hợp lệ và chuyển text thành số. Feature engineering là biến đổi hoặc tạo thông tin hữu ích hơn cho model, như biến tuổi lịch sử tín dụng thành tổng số tháng. Còn feature selection là chọn ra những features nên đưa vào model."},{"type":"question","text":"Anh/chị hỏi: Vì sao dùng Genetic Algorithm?"},{"type":"speech","text":"Dạ em dùng nó như một phương pháp tìm kiếm tổ hợp features. Thay vì thử thủ công mọi bộ biến, thuật toán đánh giá các tập ứng viên theo tiêu chí phù hợp rồi dần tìm ra tập tốt hơn. Em cũng hiểu là việc chọn feature phải được thực hiện trong quy trình đánh giá đúng để tránh leakage."},{"type":"question","text":"Anh/chị hỏi: Tại sao Random Forest tốt hơn?"},{"type":"speech","text":"Dạ ở kết quả thử nghiệm cụ thể này, Random Forest có thể nắm bắt các quan hệ phi tuyến và tương tác giữa các thuộc tính tốt hơn baseline Naïve Bayes. Tuy nhiên em sẽ không nói Random Forest luôn tốt hơn; hiệu quả còn tùy dataset, cấu hình và cách đánh giá."},{"type":"question","text":"Anh/chị hỏi: Accuracy có đủ chưa?"},{"type":"speech","text":"Dạ chưa. Giả sử 90% khách hàng thuộc nhóm tốt, model dự đoán tất cả là tốt vẫn có Accuracy 90% nhưng không phát hiện được khách hàng rủi ro. Vì vậy em cần precision, recall và confusion matrix theo từng class, đồng thời xác định loại lỗi nào gây tác động kinh doanh lớn hơn."},{"type":"question","text":"Anh/chị hỏi: Data leakage là gì?"},{"type":"speech","text":"Dạ, nói đơn giản là mô hình vô tình được tiếp cận thông tin mà khi dự đoán thực tế nó không có, hoặc dữ liệu test đã ảnh hưởng tới quy trình training. Ví dụ em tính trung bình để điền missing values trên cả dataset rồi mới chia train/test thì test đã ảnh hưởng vào preprocessing. Cách đúng là chia dữ liệu và fit những bước có học tham số trên train."},{"type":"question","text":"Anh/chị hỏi: Nếu anh/chị mở KNIME và hỏi em làm từng bước như thế nào?"},{"type":"speech","text":"Dạ em bắt đầu bằng việc đọc dataset và kiểm tra schema, sau đó xử lý các trường không hợp lệ và chuyển những cột số có ký tự sang numeric. Tiếp theo em tạo Total_CHA, xử lý thông tin loan type, chọn 12 features bằng Genetic Algorithm, rồi đưa tập biến này vào các nhánh Naïve Bayes và Random Forest để so sánh. Các node cụ thể trong KNIME em sẽ đối chiếu với workflow gốc trước khi nói chính xác tên hoặc tham số."},{"type":"speech","text":"Ví dụ trực tiếp của em là biến Credit History Age từ ‘5 năm 3 tháng’ thành Total_CHA = 63. Đây là feature engineering. Còn Genetic Algorithm chọn 12 features từ những biến đã chuẩn bị là feature selection. Em muốn phân biệt rõ hai thao tác để người nghe thấy được logic pipeline."},{"type":"question","text":"Anh/chị hỏi: Nếu gặp missing values, em điền mean hay median?"},{"type":"speech","text":"Dạ không có một phương pháp đúng cho mọi cột. Với biến số bị lệch nhiều hoặc có outliers, median có thể ít bị ảnh hưởng hơn mean; với biến danh mục có thể dùng mode hoặc nhóm Unknown. Nhưng trước đó em phải hỏi vì sao thiếu: thiếu ngẫu nhiên hay thiếu có ý nghĩa nghiệp vụ. Ví dụ người chưa từng vay có thể không có dữ liệu lịch sử tín dụng, trường hợp đó không nên tự động coi là lỗi cần điền trung bình."},{"type":"question","text":"Anh/chị hỏi: Regex là gì và giúp em thế nào?"},{"type":"speech","text":"Dạ regex là cách mô tả một mẫu ký tự để tìm, kiểm tra hoặc thay thế trong chuỗi. Ví dụ một trường Income có chữ hoặc dấu phân cách không nhất quán, em có thể dùng regex để tách phần số sau khi đã thống nhất quy tắc định dạng. Tuy nhiên em phải cẩn thận dấu phẩy có thể là dấu thập phân hoặc phân tách hàng nghìn, nên không thể cứ xóa mọi ký tự không phải số mà mặc định dữ liệu đúng."},{"type":"question","text":"Anh/chị hỏi: Feature Engineering và Genetic Algorithm khác nhau thế nào?"},{"type":"speech","text":"Dạ feature engineering là tạo hoặc biến đổi thông tin đầu vào, ví dụ từ 5 năm 3 tháng tạo thành 63 tháng. Genetic Algorithm trong dự án là feature selection, tức tìm xem giữ những features nào trong bộ có sẵn. Một bên thay đổi cách biểu diễn dữ liệu, một bên chọn tổ hợp biến. Hai bước bổ trợ nhau nhưng không phải cùng một việc."},{"type":"question","text":"Anh/chị hỏi: Làm sao xác định 12 features là lựa chọn tốt?"},{"type":"speech","text":"Dạ em sẽ nhìn kết quả đánh giá trên validation hoặc cross-validation với cùng metric, rồi so với baseline dùng bộ features ban đầu. Nếu tăng điểm trên test cuối cùng vì đã dùng test để chọn, kết quả dễ bị lạc quan. Trong tài liệu em nhớ kết quả là 12 features, nhưng em không muốn tự khẳng định fitness function hay số vòng lặp Genetic Algorithm khi chưa kiểm tra lại file workflow."},{"type":"question","text":"Anh/chị hỏi: Random Forest hoạt động thế nào — em giải thích dễ hiểu thử?"},{"type":"speech","text":"Dạ, một decision tree sẽ đặt những câu hỏi kiểu thu nhập cao hay thấp, thời gian tín dụng dài hay ngắn rồi đi tới một nhãn. Random Forest tạo nhiều cây với những biến thể dữ liệu và thuộc tính, mỗi cây dự đoán một nhãn; kết quả cuối thường lấy theo số phiếu. Cách này giúp giảm phụ thuộc vào một cây đơn lẻ, nhưng mô hình vẫn có thể overfit hoặc thiên lệch nếu dữ liệu huấn luyện không tốt."},{"type":"question","text":"Anh/chị hỏi: Làm sao chia Training/Test và tránh leakage?"},{"type":"speech","text":"Dạ Training Set là phần model dùng để học, Test Set được giữ lại để đánh giá trên dữ liệu chưa dùng trong phát triển mô hình. Nếu có nhiều cấu hình thì em nên dùng Validation Set hoặc cross-validation để chọn. Khi điền missing, scaling hoặc chọn features, em chỉ fit trên train rồi áp dụng sang test. Nếu là dữ liệu theo thời gian hoặc có nhiều bản ghi cùng một khách hàng, còn phải chia phù hợp để tránh cùng một đối tượng xuất hiện ở cả hai phía."},{"type":"question","text":"Anh/chị hỏi: Nếu triển khai Credit Score trong insurance thì em áp dụng thế nào?"},{"type":"speech","text":"Dạ em sẽ không bê nguyên mô hình tín dụng sang bảo hiểm, vì nhãn và mục tiêu nghiệp vụ khác. Nhưng các kỹ thuật chuyển giao được là data cleaning, feature engineering, chọn biến, baseline classification và đánh giá theo tác động của false positives/false negatives. Ví dụ bài toán churn hoặc persistency cần định nghĩa nhãn thật rõ, hiểu lúc nào thông tin sẵn có, rồi kiểm tra dữ liệu và metrics trên từng phân khúc."},{"type":"question","text":"Anh/chị hỏi: Nếu một cột thiếu 40% dữ liệu, em xử lý thế nào?"},{"type":"speech","text":"Dạ em không xóa ngay chỉ vì thiếu 40%. Em xem đây là biến quan trọng không, missing có liên quan đến nhóm khách hàng hay nhãn không, và dữ liệu còn lại có đại diện không. Em thử phương án bỏ cột, giữ cột với imputation và missing indicator trên validation rồi so kết quả. Em không chọn bằng test set cuối cùng."},{"type":"question","text":"Anh/chị hỏi: Tại sao median có thể tốt hơn mean khi điền Income?"},{"type":"speech","text":"Dạ giả sử income lần lượt là 10, 12, 14 và 200 triệu, mean là 59 còn median là 13. Nếu 200 là giá trị cao thật nhưng hiếm, mean bị kéo rất mạnh. Khi muốn đại diện mức điển hình để điền thiếu, median có thể phù hợp hơn. Tuy nhiên em vẫn phải xem bối cảnh nghiệp vụ và cách phân phối."},{"type":"question","text":"Anh/chị hỏi: Sau khi xử lý dữ liệu xong, em kiểm tra chất lượng bằng gì?"},{"type":"speech","text":"Dạ em so số bản ghi, schema, null rate và invalid rate trước/sau, xem target distribution, kiểm tra duplicate theo key và spot-check một vài dòng gốc. Nếu có rule nghiệp vụ như số lượng khoản vay không âm, em muốn viết thành điều kiện kiểm thử lặp lại được. Em cũng giữ được log số dòng bị sửa hoặc loại để giải thích kết quả."},{"type":"speech","text":"Ví dụ giả định, nếu một cột số lượng khoản vay còn giá trị -3 sau preprocessing thì bước validation phải báo lỗi. Em không muốn để quy tắc này nằm ở thao tác thủ công chỉ một lần; nếu chuyển thành check có thể lặp lại, team sẽ dễ đối soát khi dữ liệu được cập nhật."},{"type":"question","text":"Anh/chị hỏi: Vì sao không thể chọn features bằng toàn bộ dataset?"},{"type":"speech","text":"Dạ vì khi nhìn cả test để chọn biến, mình đã dùng thông tin test trong quá trình model development. Dù model chưa fit trực tiếp trên test, đánh giá sau đó cũng có thể bị lạc quan. Em cần chọn biến chỉ trên training hoặc trong cross-validation, rồi giữ test cho bước đánh giá cuối."},{"type":"meta","text":"GHI NHỚ  Dự án độc lập; chưa chứng minh mô hình giúp giảm tổn thất tín dụng thật. Precision Good Credit không thay được Recall của nhóm rủi ro. Thông số Genetic Algorithm và các node KNIME cụ thể chưa có trong tài liệu đang dùng; các ví dụ quy trình, dữ liệu giả định và phương án xử lý nâng cao là cách giải thích/phương án đề xuất."}]},{"id":"s8","title":"06  HOUSING PRICE PREDICTION — ACADEMIC PROJECT","items":[{"type":"meta","text":"TỪ KHÓA ĐỂ NHỚ  Business → Schema/Grain → Missing/Duplicate → Encoding → Scaling/Split → LR vs RF → MAE/RMSE → App tóm tắt"},{"type":"h2","text":"Bài nói chính — giọng trao đổi với interviewer"},{"type":"speech","text":"Dạ, Housing Price Prediction là một dự án dự đoán giá nhà dựa trên thuộc tính bất động sản. Khác với Credit Score là classification, dự án này là regression vì đầu ra là số tiền liên tục. Với dự án này, em muốn nhấn mạnh nhất cách chuẩn bị dữ liệu, vì các thuộc tính rất khác nhau: Suburb là categorical, trong khi Rooms, Distance, Landsize hay BuildingArea là số."},{"type":"speech","text":"Ví dụ dễ hình dung là Suburb cần encoding vì đó là tên khu vực, còn BuildingArea là số. Nếu em gán tùy tiện khu A = 1, B = 2, C = 3 cho Linear Regression, mô hình có thể hiểu nhầm khoảng cách giữa các khu vực. One-hot encoding là một cách tránh áp đặt thứ tự giả này."},{"type":"speech","text":"Theo tài liệu dự án, em xử lý missing values và duplicate, chuyển categorical features sang numerical representation, thực hiện scaling/normalization rồi chia train/test. Em cần phân biệt dữ liệu không hợp lệ với quan sát hiếm nhưng vẫn đúng: ví dụ diện tích âm là bất hợp lý, nhưng một căn nhà có giá rất cao có thể là tài sản đặc biệt chứ không phải lỗi. Nếu dùng Suburb, model cần một cách encoding phù hợp. One-hot encoding là ví dụ em có thể giải thích, nhưng tài liệu không xác nhận chính xác loại encoder em đã sử dụng."},{"type":"speech","text":"Sau preprocessing, em thử Linear Regression làm baseline và Random Forest Regressor để học những quan hệ phi tuyến. Tài liệu ghi Random Forest đạt kết quả tốt hơn trong thử nghiệm, nhưng không đưa giá trị MAE, RMSE hay R² cụ thể. Em hiểu để kết luận chắc chắn cần đánh giá hai model trên cùng tập test, đối chiếu các metric và kiểm tra khả năng generalization."},{"type":"speech","text":"Dự án cũng có một web app để người dùng nhập thông tin và nhận giá ước tính. Em dùng React và FastAPI để nối giao diện với mô hình, nhưng trọng tâm em muốn chia sẻ trong buổi phỏng vấn là cách em chuẩn bị features và kiểm soát độ tin cậy của dự đoán. Đối với em, bài học chính là dữ liệu được xử lý nhất quán giữa lúc train và lúc dự đoán quan trọng không kém việc chọn model ạ."},{"type":"speech","text":"Ví dụ giả định, nếu khi train em dùng one-hot cho Suburb nhưng lúc người dùng nhập một khu vực mới em lại gửi nguyên chuỗi vào model, kết quả có thể lỗi hoặc dùng sai cột. Vì vậy em muốn giữ cùng một preprocessing pipeline giữa training và prediction."},{"type":"h2","text":"Cách em sử dụng kỹ thuật — theo từng bước"},{"type":"h3","text":"Bước 1 — Data Profiling: feature, target và ý nghĩa một dòng"},{"type":"speech","text":"Dạ mỗi dòng dữ liệu là một quan sát bất động sản và Price là target. Em xác định các cột Suburb, Rooms, Distance, Bathroom, Car, Landsize, BuildingArea, YearBuilt trước khi làm sạch. Em sẽ kiểm tra data types, missing rate, range và phân bố giá. Ví dụ nếu YearBuilt lớn hơn năm hiện tại hoặc Landsize âm thì có khả năng sai dữ liệu; nhưng giá nhà rất cao không đủ để kết luận là lỗi."},{"type":"h3","text":"Bước 2 — Missing Values: hiểu nguyên nhân trước khi điền"},{"type":"speech","text":"Dạ tài liệu xác nhận có xử lý missing values nhưng không nói rõ dùng mean, median hay phương án nào. Nếu BuildingArea thiếu, em cần xem thiếu vì nguồn không đo, vì không áp dụng, hay vì nhập sai. Ví dụ minh họa các diện tích 90, 100, 110 và 500 m² có mean 200, median 105; nếu 500 là căn đặc biệt thì median có thể là đại diện ổn hơn cho nhóm thông thường. Em chỉ fit giá trị điền từ train và áp dụng cho test."},{"type":"h3","text":"Bước 3 — Duplicates và Outliers: tránh xóa nhầm"},{"type":"speech","text":"Dạ hai căn nhà ở cùng khu vực, cùng 3 phòng và cùng diện tích vẫn có thể là hai tài sản khác nhau, nên không thể gọi duplicate chỉ vì vài thuộc tính giống nhau. Em phải xem một dòng là bản ghi listing, giao dịch hay nhà cụ thể; từ đó mới xác định key. Với outlier, diện tích âm thường là invalid, nhưng một căn nhà siêu sang đắt hơn phần lớn thị trường có thể vẫn đúng. Em sẽ kiểm tra theo domain rules, so nguồn gốc và đánh giá ảnh hưởng trước khi loại."},{"type":"h3","text":"Bước 4 — Categorical Encoding: Suburb là chữ thì sao?"},{"type":"speech","text":"Dạ nhiều model cần dữ liệu số. Ví dụ Suburb có Richmond, Carlton và Fitzroy, nếu em gán 1, 2, 3 thì có thể khiến Linear Regression hiểu sai rằng có trật tự khoảng cách giữa các tên. One-hot encoding tạo các cột 0/1 tương ứng, là một phương án có thể dùng. Nhưng đây là ví dụ kỹ thuật; tài liệu chỉ xác nhận đã categorical-to-numeric conversion, chưa xác nhận encoder thực tế. Em cũng cần xử lý khu vực chưa từng xuất hiện trong train."},{"type":"h3","text":"Bước 5 — Scaling và normalization: dùng khi nào?"},{"type":"speech","text":"Dạ Distance có thể khoảng vài km, còn Landsize có thể hàng trăm hoặc hàng nghìn m². Scaling đưa features về thang đo dễ xử lý hơn cho các thuật toán nhạy với scale. Tuy nhiên Random Forest dựa trên cây thường không cần scaling; Linear Regression OLS cũng không bắt buộc phải scale, nhưng scaling có thể hữu ích với regularization hoặc ổn định tính toán. Tài liệu có thực hiện scaling, nên khi giải thích em sẽ nói vì sao cần chọn cách transform phù hợp model thay vì cho rằng tất cả model đều bắt buộc."},{"type":"h3","text":"Bước 6 — Feature Engineering: điểm khác với encoding"},{"type":"speech","text":"Dạ trong phần tài liệu, việc encoding và scaling được ghi rõ, còn chưa mô tả derived feature mới. Nếu anh/chị hỏi mở rộng, em có thể đề xuất tạo Property Age = năm đánh giá trừ YearBuilt, hoặc tỷ lệ BuildingArea/Landsize nếu dữ liệu phù hợp. Em sẽ ghi rõ đây là hướng cải tiến, không phải feature đã xác nhận thực hiện. Đặc biệt em không dùng Price/BuildingArea làm feature để dự đoán chính Price, vì đó là target leakage."},{"type":"h3","text":"Bước 7 — Train/Test Split và preprocessing pipeline"},{"type":"speech","text":"Dạ sau khi tách các features và target, cần giữ test set để đánh giá trên nhà chưa dùng để phát triển model. Ví dụ giả định 10.000 căn nhà thì 8.000 train và 2.000 test. Những biến đổi học từ dữ liệu như median imputation, scaling hay encoder phải fit trên train, rồi transform test bằng cùng bộ tham số. Nếu có nhiều listing của cùng một căn hoặc dữ liệu theo thời gian, cần xem lại cách chia để tránh leakage."},{"type":"h3","text":"Bước 8 — Model: Linear Regression và Random Forest"},{"type":"speech","text":"Dạ Linear Regression học một tổ hợp tuyến tính của các thuộc tính làm baseline, dễ giải thích và train nhanh. Random Forest Regressor tạo nhiều decision trees rồi thường lấy trung bình dự đoán của các cây, cho phép nắm bắt tương tác phi tuyến. Nếu model Random Forest tốt hơn trong thử nghiệm thì em sẽ đọc metric cùng điều kiện chia dữ liệu, chứ không tự nói đó là bằng chứng nó luôn tốt hơn Linear Regression."},{"type":"h3","text":"Bước 9 — Evaluation: MAE, RMSE và R²"},{"type":"speech","text":"Dạ nếu giá thật của ba căn là 500, 700, 900 nghìn đô và model dự đoán 480, 720, 860 thì sai số tuyệt đối là 20, 20, 40 nghìn. MAE là (20+20+40)/3 = khoảng 26,7 nghìn đô. RMSE sẽ phạt trường hợp sai lệch 40 mạnh hơn; R² so mức độ khớp với baseline dự đoán trung bình. Các giá trị này hoàn toàn là ví dụ minh họa. Tài liệu dự án chưa có bảng MAE/RMSE thực, nên em không đưa ra số liệu thật khi chưa kiểm tra workflow."},{"type":"h3","text":"Bước 10 — Frontend/Backend: chỉ giải thích luồng tổng quan"},{"type":"speech","text":"Dạ phần web em chỉ trình bày ngắn: người dùng nhập thông tin căn nhà qua React, hệ thống gửi request đến FastAPI, backend đưa input qua bước preprocessing tương ứng rồi gọi model để trả giá dự đoán. Điểm em muốn nhấn mạnh không phải chi tiết frontend mà là dữ liệu lúc dự đoán phải có đúng schema và cùng encoding/scaling như lúc huấn luyện."},{"type":"speech","text":"Ví dụ khi người dùng nhập thiếu BuildingArea, em cần xác định hệ thống sẽ báo thiếu, áp dụng quy tắc điền đã học từ training hay cho phép giá trị thiếu nếu model hỗ trợ; không nên tự thay bằng số 0 mà không giải thích."},{"type":"h2","text":"Nếu anh/chị hỏi sâu"},{"type":"question","text":"Anh/chị hỏi: Regression khác classification ở đâu?"},{"type":"speech","text":"Dạ classification là dự đoán nhóm, chẳng hạn Good hoặc Poor Credit. Regression là dự đoán giá trị liên tục, ví dụ giá nhà 500.000 đô. Vì đầu ra khác nhau nên metric đánh giá cũng khác nhau."},{"type":"question","text":"Anh/chị hỏi: MAE, RMSE và R² là gì?"},{"type":"speech","text":"Dạ MAE là độ lớn sai số trung bình, dễ hiểu theo đơn vị giá. RMSE cũng đo sai số nhưng phạt lỗi lớn mạnh hơn. R² cho biết model giải thích biến động của giá tốt hơn baseline dự đoán trung bình đến mức nào. Em sẽ xem nhiều metric chứ không gọi chung là Accuracy."},{"type":"question","text":"Anh/chị hỏi: Nếu input mới có suburb chưa từng xuất hiện trong training thì sao?"},{"type":"speech","text":"Dạ em sẽ cần một preprocessing pipeline xử lý được unknown categories, ví dụ cấu hình one-hot encoder với handle_unknown phù hợp. Điều quan trọng là đầu vào lúc inference phải đi qua cùng logic preprocessing như lúc training."},{"type":"question","text":"Anh/chị hỏi: Nếu anh/chị hỏi kỹ cách làm sạch dữ liệu giá nhà?"},{"type":"speech","text":"Dạ em kiểm tra các trường bị thiếu và trùng, xem các trường numeric đã đúng kiểu chưa, rồi chuyển categorical features sang dạng số. Em còn phải kiểm tra ý nghĩa nghiệp vụ: ví dụ YearBuilt sau năm hiện tại hoặc diện tích âm thì không hợp lý. Riêng việc dùng median để điền thiếu hay rule cụ thể cho outlier em sẽ xem là phương án xử lý nếu được yêu cầu, vì tài liệu không mô tả từng quy tắc đã dùng."},{"type":"question","text":"Anh/chị hỏi: One-hot encoding là gì, vì sao cần cho Suburb?"},{"type":"speech","text":"Dạ model không tự hiểu chữ 'Richmond' hay 'Carlton' dưới dạng các con số có ý nghĩa. One-hot encoding tạo những cột chỉ báo 0/1 cho từng khu vực, tránh việc vô tình gán Richmond = 1 và Carlton = 2 rồi làm model hiểu khu vực 2 lớn gấp đôi khu vực 1. Ví dụ này minh họa một lựa chọn encoding hợp lý, còn tài liệu chỉ xác nhận đã chuyển categorical sang numerical representation."},{"type":"question","text":"Anh/chị hỏi: Scaling có thật sự cần cho Random Forest không?"},{"type":"speech","text":"Dạ với Random Forest dựa trên cây quyết định, việc thay đổi đơn vị tuyến tính của feature thường ít ảnh hưởng tới cách cây chia. Ngược lại, scaling quan trọng hơn với nhiều mô hình dựa trên khoảng cách hay thuật toán tối ưu nhạy với thang đo. Với Linear Regression OLS đơn giản, scaling không phải điều kiện bắt buộc để dự đoán đúng, nhưng có thể giúp ổn định bài toán số học hoặc khi có regularization. Em sẽ chọn preprocessing phù hợp từng model."},{"type":"question","text":"Anh/chị hỏi: Nếu có 3 căn nhà để tính MAE thì làm sao?"},{"type":"speech","text":"Dạ giả sử sai số tuyệt đối của ba căn là 20.000, 10.000 và 30.000 đô, MAE là tổng 60.000 chia 3, bằng 20.000 đô. MAE cho phép nói trung bình model lệch khoảng 20.000 đô trên ba quan sát ví dụ. RMSE sẽ lớn hơn hoặc bằng MAE và nhạy hơn với những sai số rất lớn. Đây chỉ là ví dụ số học, không phải metric thực tế của dự án."},{"type":"question","text":"Anh/chị hỏi: Random Forest Regression khác Random Forest Classification thế nào?"},{"type":"speech","text":"Dạ hai phương pháp đều dựa trên nhiều cây, nhưng classification trả về lớp hoặc xác suất lớp và thường gộp bằng voting/averaging class probabilities, còn regression dự đoán giá trị số và thường gộp bằng cách lấy trung bình. Ví dụ Credit Score đầu ra là Good/Standard/Poor; Housing đầu ra là giá như 500.000 đô."},{"type":"question","text":"Anh/chị hỏi: Nếu training dùng encoder mà production quên encoder sẽ thế nào?"},{"type":"speech","text":"Dạ model có thể nhận sai số lượng cột, sai thứ tự feature hoặc không hiểu dữ liệu text, dẫn tới lỗi hoặc dự đoán sai. Em muốn lưu preprocessing cùng model hoặc đảm bảo endpoint tái sử dụng đúng pipeline đã fit trên train. Kiểm thử API nên có các case thiếu trường, sai kiểu, giá trị ngoài phạm vi và danh mục mới."},{"type":"speech","text":"Ví dụ giả định, lúc train thứ tự features là Rooms, Distance, BuildingArea; khi dự đoán lại truyền BuildingArea, Rooms, Distance thì cả ba giá trị đều là số nhưng model hiểu sai ý nghĩa. Kiểm tra schema và tái sử dụng cùng pipeline sẽ giảm rủi ro này."},{"type":"question","text":"Anh/chị hỏi: Em xác nhận Random Forest tốt hơn bằng cách nào?"},{"type":"speech","text":"Dạ về nguyên tắc phải so cùng train/test split và cùng cách đo, ví dụ MAE, RMSE, R². Tài liệu hiện tại chỉ ghi Random Forest tốt hơn trong thử nghiệm, chưa đưa bảng metric chi tiết, nên em không tự suy ra giảm bao nhiêu phần trăm sai số. Nếu có workflow gốc, em sẽ trích lại metric để diễn đạt chính xác."},{"type":"question","text":"Anh/chị hỏi: Nếu Suburb xuất hiện một giá trị mới thì xử lý sao?"},{"type":"speech","text":"Dạ đây là câu hỏi về categorical encoding. Nếu ứng dụng gặp một suburb không có trong train, encoder cần cấu hình xử lý unknown category hoặc có quy tắc mapping khác phù hợp. Nếu không, dữ liệu đầu vào có thể sai schema hoặc gây lỗi. Em sẽ kiểm tra trước khi đưa model dùng thực tế."},{"type":"question","text":"Anh/chị hỏi: Nhà giá rất cao có phải outlier cần loại không?"},{"type":"speech","text":"Dạ chưa chắc. Em xem nó là dữ liệu hợp lệ nhưng hiếm hay lỗi nhập liệu. Ví dụ Price = 10 triệu đô có thể đúng với nhà cao cấp, còn BuildingArea = -100 m² là bất hợp lý. Em sẽ dựa trên domain checks, phân bố và mục đích bài toán trước khi xử lý."},{"type":"question","text":"Anh/chị hỏi: Nếu điền thiếu bằng median trên toàn bộ dữ liệu rồi split thì sao?"},{"type":"speech","text":"Dạ đó là nguy cơ data leakage vì median đã có đóng góp từ test set. Cách phù h
