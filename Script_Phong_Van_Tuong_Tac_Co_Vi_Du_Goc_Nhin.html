ợp là fit median trên train và dùng median đó để transform validation/test, cùng một pipeline khi đánh giá hay dự đoán."},{"type":"question","text":"Anh/chị hỏi: Feature Engineering trong dự án Housing đã làm những gì?"},{"type":"speech","text":"Dạ theo tài liệu em đã encoding categorical features và scaling/normalization, là những phép biến đổi đầu vào. Tài liệu chưa ghi rõ các derived features mới; nếu anh/chị hỏi em sẽ phân biệt kỹ thuật đã làm với đề xuất như Property Age hoặc area ratio, và không nhận là em đã triển khai nếu chưa có chứng cứ."},{"type":"question","text":"Anh/chị hỏi: Làm sao biết cleaning có làm lệch dữ liệu không?"},{"type":"speech","text":"Dạ em sẽ đối chiếu số dòng trước/sau, tỷ lệ missing/invalid, phân bố Price và các features chính, đặc biệt xem có vô tình loại nhiều nhà ở một khu vực hoặc phân khúc giá nào không. Nếu dữ liệu mất tính đại diện thì model có thể hoạt động kém ở chính phân khúc bị loại."},{"type":"meta","text":"GHI NHỚ  Tài liệu xác nhận xử lý missing, duplicates, categorical conversion, scaling và train/test; không xác nhận cách impute/encoder cụ thể hay MAE/RMSE. Phần frontend/backend chỉ mô tả mức tổng quan, không đi sâu code."}]},{"id":"reflection","title":"07  GÓC NHÌN CÁ NHÂN + VÍ DỤ THUYẾT PHỤC","items":[{"type":"meta","text":"TẬP NÓI THEO CẤU TRÚC: Quan điểm của em → Ví dụ cụ thể → Nếu xử lý sai thì sao → Tác động với team. Tình huống giả định được nói rõ là “ví dụ giả định”, không phải thành tích thực tế."},{"type":"h2","text":"Bài nói tổng kết — khoảng 2 phút"},{"type":"speech","text":"Dạ, sau những dự án em làm, theo em Data Preprocessing và Feature Engineering không phải chỉ là hai bước kỹ thuật để model chạy được. Đây là phần quyết định dữ liệu có phản ánh đúng nghiệp vụ và có thể sử dụng để ra quyết định hay không."},{"type":"speech","text":"Em lấy ví dụ ở Talent Mobility. Khi kiểm tra bảng yêu cầu kỹ năng, em thấy Team và Role lặp lại. Nếu em vội xóa những dòng đó vì tưởng duplicate thì có thể xóa mất một skill hợp lệ. Khi đó dữ liệu nhìn gọn hơn nhưng điểm matching lại sai. Nên với em, preprocessing tốt là phải hiểu một dòng đại diện cho điều gì trước khi xử lý."},{"type":"speech","text":"Còn Feature Engineering giúp chuyển thông tin thô thành một cách biểu diễn có ý nghĩa hơn. Ví dụ trong Credit Score, em chuyển Credit History Age từ 5 năm 3 tháng thành 63 tháng. Sau đó em mới lựa chọn features và so sánh mô hình. Em thấy hai bước này nối tiếp nhau: dữ liệu sạch mà feature không phù hợp thì model vẫn có thể học chưa tốt; nhưng feature hay đến đâu mà dữ liệu đầu vào sai thì kết quả cũng khó đáng tin."},{"type":"speech","text":"Điều đó càng quan trọng khi kết quả được team sử dụng. Ví dụ với S2T, nếu khách hàng nói 21 triệu nhưng transcript ghi 211 triệu thì NER có thể trích đúng từ transcript nhưng thông tin cuối cùng vẫn sai. Em nghĩ mình phải truy đúng nguồn lỗi trước khi sửa, chứ không chỉ nhìn một metric tổng."},{"type":"speech","text":"Tóm lại, điều em rút ra là trước khi chọn một model phức tạp hơn, em muốn chắc rằng dữ liệu được xử lý đúng, những features hoặc KPI có ý nghĩa và kết quả đã được kiểm chứng. Khi đó, phần phân tích mới thực sự hỗ trợ team đưa ra quyết định tốt hơn ạ."},{"type":"h2","text":"Câu hỏi đào sâu — luôn có một ví dụ chứng minh"},{"type":"question","text":"Anh/chị hỏi: Vì sao em cho rằng Preprocessing quan trọng hơn việc chọn model ngay từ đầu?"},{"type":"speech","text":"Dạ theo em, chọn model là cần thiết, nhưng model chỉ học từ những gì mình đưa vào. Ví dụ giả định ở Credit Score: Income bị lưu thành chuỗi “45,000” và một số giá trị âm vô lý. Nếu không xử lý, một phần dữ liệu có thể bị bỏ qua hoặc tạo tín hiệu sai. Khi dữ liệu đầu vào chưa ổn, việc đổi từ Naïve Bayes sang Random Forest chưa chắc giải quyết đúng vấn đề gốc ạ."},{"type":"question","text":"Anh/chị hỏi: Em có thể cho một ví dụ dữ liệu đúng format nhưng sai nghiệp vụ không?"},{"type":"speech","text":"Dạ có ạ, ở Talent Mobility cùng Team và Role lặp lại vẫn có thể là dữ liệu đúng vì mỗi dòng là một skill. Nếu em chỉ nhìn sự lặp lại của hai cột rồi xóa, em làm mất yêu cầu kỹ năng. Ví dụ giả định một role cần SQL và Python, nếu mất Python thì nhân viên biết SQL có thể bị xem là đủ yêu cầu, trong khi thực tế vẫn còn gap. Đây là lý do em luôn kiểm tra grain và business key."},{"type":"question","text":"Anh/chị hỏi: Khi nào em quyết định không xóa missing value hoặc outlier?"},{"type":"speech","text":"Dạ em sẽ phân biệt dữ liệu sai với dữ liệu hiếm nhưng hợp lệ. Ví dụ giả định, BuildingArea thiếu ở 30% căn nhà; nếu xóa hết thì tập dữ liệu có thể mất tính đại diện. Em cần xem thiếu vì sao, có thể điền từ training data hay thêm missing indicator không. Tương tự, một căn nhà giá rất cao chưa chắc sai vì có thể ở khu vực đặc biệt; em sẽ đối chiếu domain rules trước khi loại bỏ."},{"type":"question","text":"Anh/chị hỏi: Feature Engineering khác Feature Selection, và tại sao cần cả hai?"},{"type":"speech","text":"Dạ Feature Engineering là biến đổi thông tin để mô hình hiểu tốt hơn. Ví dụ em chuyển 5 năm 3 tháng lịch sử tín dụng thành Total_CHA = 63 tháng. Feature Selection thì chọn những biến có ích trong tập đầu vào, ví dụ em dùng Genetic Algorithm để chọn 12 features trong Credit Score. Em cần làm đúng phần biến đổi trước rồi mới đánh giá biến nào đáng giữ, tránh để test set ảnh hưởng vào quá trình lựa chọn."},{"type":"question","text":"Anh/chị hỏi: Nếu Feature Engineering làm metric tăng thì có đủ để kết luận tốt hơn không?"},{"type":"speech","text":"Dạ chưa đủ ạ. Ví dụ giả định, Accuracy tăng từ 78% lên 82% nhưng recall của nhóm tín dụng xấu lại giảm mạnh thì kết quả có thể kém phù hợp với mục tiêu quản trị rủi ro. Em sẽ kiểm tra trên validation/test độc lập, so theo từng class và đối chiếu metric với business cost trước khi kết luận."},{"type":"question","text":"Anh/chị hỏi: Vì sao Data Leakage nguy hiểm?"},{"type":"speech","text":"Dạ vì nó làm kết quả đánh giá đẹp hơn thực tế. Ví dụ giả định có 10.000 căn nhà chia train và test; nếu em tính median BuildingArea hoặc chọn features bằng cả 10.000 dòng trước khi chia, em đã để thông tin từ test ảnh hưởng vào pipeline phát triển. Đúng hơn là fit các bước có học tham số trên train rồi áp dụng cho test, giữ test thật sự độc lập ạ."},{"type":"question","text":"Anh/chị hỏi: Data Preprocessing liên hệ với Business Outcome như thế nào?"},{"type":"speech","text":"Dạ em nghĩ mối liên hệ nằm ở chỗ dữ liệu sai thì quyết định cuối cũng dễ sai. Ví dụ trong Talent Mobility, xóa nhầm skill làm lệch readiness. Ở MWG, nếu hai tháng dùng mẫu số Survey Reach Rate khác nhau thì phần trăm nhìn đúng phép tính nhưng so sánh MoM lại không có ý nghĩa. Team cần dữ liệu và KPI được định nghĩa nhất quán trước khi dựa vào báo cáo để ưu tiên hành động."},{"type":"question","text":"Anh/chị hỏi: Em làm gì nếu kết quả AI khá tốt về metric tổng nhưng sai dữ liệu quan trọng?"},{"type":"speech","text":"Dạ em sẽ đưa thêm chỉ số đúng theo nghiệp vụ. Trong dự án S2T có tình huống transcript sai “21 triệu” thành “211 triệu”; NER có thể vẫn trích đúng theo transcript đó. Nếu chỉ nhìn WER tổng thể thì dễ bỏ qua hậu quả. Em sẽ đánh giá riêng các entity quan trọng và điều tra lỗi ở bước S2T hay NER, để team biết nên sửa phần nào trước."},{"type":"question","text":"Anh/chị hỏi: Có phải em đã dùng mọi kỹ thuật được đề xuất trong các ví dụ này?"},{"type":"speech","text":"Dạ không ạ. Những gì em đã trực tiếp làm như regex cleaning trong Credit Score, xử lý duplicate theo grain ở Talent Mobility hay RCA S2T/NER thì em có thể mô tả workflow thực tế. Còn những cách như thêm missing indicator, kiểm thử calibration hay xây kiểm tra drift tự động là các phương án em sẽ cân nhắc nếu mở rộng dự án. Em muốn phân biệt rõ kinh nghiệm đã có với ý tưởng cải thiện ạ."},{"type":"h2","text":"Mẹo kể ví dụ — không kể dài, chỉ cần đủ bằng chứng"},{"type":"speech","text":"Dạ em thường dùng bốn ý để giải thích một quan điểm: thứ nhất là em nghĩ điều gì quan trọng; thứ hai là một ví dụ cụ thể; thứ ba là nếu không làm đúng thì chuyện gì có thể xảy ra; cuối cùng là việc đó giúp team quyết định tốt hơn như thế nào. Em nghĩ nói như vậy ngắn nhưng thể hiện được lý do đằng sau quyết định kỹ thuật ạ."}]},{"id":"s9","title":"B. KIẾN THỨC NỀN — CÁCH GIẢI THÍCH BẰNG LỜI","items":[{"type":"speech","text":"Đây là phần nên luyện trả lời ngắn, dễ hiểu, rồi lấy ví dụ từ đúng dự án. Nếu anh/chị muốn chi tiết, em mới mở rộng thêm công thức hoặc cách làm."},{"type":"question","text":"Anh/chị hỏi: Data Profiling khác Data Cleaning thế nào?"},{"type":"speech","text":"Dạ profiling là em nhìn và đo chất lượng dữ liệu trước: schema, kiểu, missing rate, min/max, phân bố. Cleaning là bước em quyết định sửa hoặc loại vấn đề dựa trên kết quả đó. Ví dụ kiểm tra thấy Income có 8% giá trị dạng text là profiling; dùng regex chuẩn hóa và chuyển sang numeric là cleaning."},{"type":"question","text":"Anh/chị hỏi: Data Validation khác Data Cleaning thế nào?"},{"type":"speech","text":"Dạ cleaning là xử lý vấn đề đã phát hiện; validation là kiểm chứng dữ liệu có đáp ứng quy tắc trước/sau khi xử lý. Ví dụ sau khi chuyển Income sang numeric em kiểm tra không còn giá trị âm không hợp lệ, không còn lỗi parse và số dòng bị loại có được ghi nhận. Nếu kiểm tra không đạt, em chưa nên đưa dữ liệu vào model."},{"type":"question","text":"Anh/chị hỏi: Missing at random và missing có ý nghĩa nghiệp vụ?"},{"type":"speech","text":"Dạ nếu dữ liệu thiếu hoàn toàn ngẫu nhiên thì cách xử lý có thể đơn giản hơn. Nhưng nếu một nhóm khách hàng nhất định thường không có thông tin tín dụng, việc thiếu có thể chính là tín hiệu cần cân nhắc. Em sẽ kiểm tra missing theo từng nhóm và target, tránh điền trung bình để che mất ý nghĩa."},{"type":"question","text":"Anh/chị hỏi: Tại sao phải xác định data grain trước duplicate?"},{"type":"speech","text":"Dạ vì một dòng có thể là customer, transaction, request event hoặc một skill requirement. Nếu em không biết grain mà xóa theo hai cột trùng, em có thể mất những quan sát hợp lệ. Ví dụ Role Skill Master có SQL và Python của cùng một role; đây là hai dòng đúng."},{"type":"question","text":"Anh/chị hỏi: IQR là gì và có nên xóa mọi outlier không?"},{"type":"speech","text":"Dạ IQR = Q3 - Q1, thường dùng khoảng dưới Q1-1,5*IQR hoặc trên Q3+1,5*IQR để gắn cờ outlier. Đây là quy tắc thống kê để điều tra, không phải lệnh xóa. Một căn nhà cao cấp hoặc thu nhập rất lớn có thể là trường hợp hiếm nhưng đúng."},{"type":"question","text":"Anh/chị hỏi: Feature Engineering khác KPI Engineering thế nào?"},{"type":"speech","text":"Dạ cả hai đều tạo thông tin từ dữ liệu, nhưng trong ML em tạo predictors để model học, như Total_CHA. Với BI, em thường tính derived metrics để mô tả hoạt động, như Request Count hay Survey Reach Rate. Không phải mọi KPI đều là ML feature và không phải mọi feature đều là KPI."},{"type":"question","text":"Anh/chị hỏi: Em kiểm chứng preprocessing theo checklist nào?"},{"type":"speech","text":"Dạ em kiểm tra row count, schema/type, missing rate, uniqueness theo business key, invalid range, phân bố target trước/sau và một số dòng đối soát thủ công. Với ML em còn kiểm tra leakage và đảm bảo cùng pipeline khi train và khi predict. Đây là checklist em sẽ áp dụng để tránh model tốt trên dữ liệu xử lý sai."},{"type":"question","text":"Anh/chị hỏi: Data Preprocessing là gì?"},{"type":"speech","text":"Dạ, em hiểu đơn giản là bước chuẩn bị dữ liệu trước khi phân tích hoặc đưa vào model. Em kiểm tra dữ liệu thiếu, sai kiểu, trùng hay giá trị không hợp lý, rồi xử lý theo quy tắc phù hợp với nghiệp vụ. Ví dụ ở Credit Score, thu nhập âm không thể coi giống một giá trị thu nhập hợp lệ. Còn ở Talent Mobility, Team và Role lặp lại chưa chắc là duplicate vì mỗi dòng có thể là một skill khác nhau."},{"type":"question","text":"Anh/chị hỏi: Feature Engineering là gì?"},{"type":"speech","text":"Dạ, là tạo hoặc biến đổi những thuộc tính giúp thể hiện thông tin hữu ích hơn. Ví dụ Credit History Age là 5 năm 3 tháng thì em đưa về 63 tháng. Với Talent Mobility, Skill Gap là chênh lệch giữa mức kỹ năng hiện tại và mức role yêu cầu. Nhưng em phân biệt rõ feature dùng để train model với KPI hoặc metric phục vụ analytics."},{"type":"question","text":"Anh/chị hỏi: Feature Selection là gì?"},{"type":"speech","text":"Dạ, feature selection là chọn các biến đầu vào phù hợp từ những biến hiện có. Trong Credit Score, em sử dụng Genetic Algorithm để chọn 12 features. Đây khác với feature engineering: một bên tạo hoặc biến đổi biến, bên còn lại chọn biến."},{"type":"question","text":"Anh/chị hỏi: Training Set, Validation Set, Test Set?"},{"type":"speech","text":"Dạ em có thể hình dung Training Set giống phần bài tập để model học; Validation Set là phần để em so sánh cấu hình và chọn model; còn Test Set là đề thi cuối cùng, dùng kiểm tra model trên dữ liệu chưa tham gia quá trình lựa chọn. Ví dụ có 10.000 căn nhà, em có thể chia 8.000 để train và 2.000 để test; nếu cần tuning thì em bố trí validation hoặc cross-validation trên tập train."},{"type":"question","text":"Anh/chị hỏi: Tại sao không dùng cả dataset để train?"},{"type":"speech","text":"Dạ nếu dùng hết dữ liệu để train thì em sẽ thiếu một bộ dữ liệu độc lập để biết model có dự đoán tốt trên trường hợp chưa gặp hay chỉ học quá sát dữ liệu cũ. Test Set giúp đánh giá khả năng generalization, miễn là em không dùng test để liên tục sửa model."},{"type":"question","text":"Anh/chị hỏi: Xử lý missing values thế nào?"},{"type":"speech","text":"Dạ em không áp dụng một công thức cố định. Em xem tỷ lệ thiếu, nguyên nhân thiếu và ý nghĩa nghiệp vụ trước. Có thể xóa nếu ít và không gây thiên lệch đáng kể, điền median nếu phân phối lệch, mode cho biến danh mục, hoặc thêm cờ missing. Nếu là ML, tham số điền thiếu phải fit từ train rồi áp dụng sang validation/test."},{"type":"question","text":"Anh/chị hỏi: Outlier có phải luôn xóa?"},{"type":"speech","text":"Dạ không ạ. Ví dụ nhà rất đắt có thể là bất động sản cao cấp thật, không phải lỗi. Em phân biệt dữ liệu sai theo domain rules với quan sát hiếm nhưng hợp lệ. Chỉ xóa hoặc winsorize sau khi hiểu mục đích phân tích và tác động đến model."},{"type":"question","text":"Anh/chị hỏi: Encoding và Scaling là gì?"},{"type":"speech","text":"Dạ encoding giúp chuyển biến danh mục như Suburb thành biểu diễn số phù hợp cho model. Scaling là đưa các biến số về thang đo phù hợp. Không phải mọi model đều cần scaling như nhau; ví dụ tree-based models thường ít nhạy với scaling hơn các mô hình dựa trên khoảng cách. Trong mọi trường hợp em muốn giữ một pipeline thống nhất giữa training và inference."},{"type":"speech","text":"Ví dụ, các khu Suburb A, B và C không có nghĩa A < B < C theo thứ tự giá trị số. Encoding phải tránh tạo ra quan hệ giả. Còn với Random Forest, scaling thường không làm thay đổi cách cây chia ngưỡng như các thuật toán nhạy với khoảng cách, nên em sẽ không mặc định mọi bước biến đổi đều cần thiết cho mọi model."},{"type":"question","text":"Anh/chị hỏi: Data Grain & Duplicate là gì?"},{"type":"speech","text":"Dạ grain trả lời câu hỏi một dòng trong bảng đang đại diện cho cái gì. Với bảng Role Skill Master, một dòng có thể là một kỹ năng của một role trong một team. Hai dòng cùng role nhưng khác skill là dữ liệu hợp lệ. Em chỉ gọi duplicate khi chúng trùng theo khóa và quy tắc nghiệp vụ xác định."},{"type":"question","text":"Anh/chị hỏi: Tại sao KPI phải có định nghĩa?"},{"type":"speech","text":"Dạ vì hai người có thể tính cùng tên KPI nhưng khác mẫu số hoặc thời điểm ghi nhận. Ví dụ Survey Reach Rate phải xác định rõ thế nào là tiếp cận thành công và mẫu số gồm những đối tượng nào. Nếu định nghĩa giữa hai tháng khác nhau thì so sánh MoM có thể sai dù phép tính Excel đúng."},{"type":"question","text":"Anh/chị hỏi: Experimentation/A-B Testing?"},{"type":"speech","text":"Dạ, A/B testing là so sánh nhóm được áp dụng thay đổi với nhóm đối chứng, có thiết kế đủ tốt để ước lượng hiệu quả tăng thêm do thay đổi đó. Ở dự án S2T, em có benchmark và regression testing theo cấu hình kỹ thuật, nhưng em sẽ không gọi đó là randomized A/B test về tác động kinh doanh."},{"type":"question","text":"Anh/chị hỏi: Model Calibration và Data Drift?"},{"type":"speech","text":"Dạ calibration là kiểm tra xác suất model dự đoán có gần với tần suất xảy ra thật không, ví dụ nhóm được dự đoán rủi ro 20% có gần 20% trường hợp xảy ra sự kiện không. Data drift là dữ liệu đầu vào thay đổi theo thời gian so với lúc train. Đây là những khái niệm em đang ôn để áp dụng trong production monitoring, chưa phải việc em đã hoàn thành ở mọi dự án."},{"type":"question","text":"Anh/chị hỏi: FYP / RYP / Persistency trong bảo hiểm?"},{"type":"speech","text":"Dạ theo cách hiểu của em, FYP là phí bảo hiểm năm đầu của hợp đồng mới, RYP là phí tái tục ở các năm sau, còn Persistency thể hiện khả năng hợp đồng tiếp tục được duy trì theo quy tắc đo của công ty. Khi phân tích, em sẽ hỏi rõ định nghĩa và kỳ tính KPI nội bộ để tránh lấy định nghĩa chung áp cho dữ liệu cụ thể."}]},{"id":"s10","title":"C. CÂU HỎI TÌNH HUỐNG VÀ ỨNG XỬ","items":[{"type":"question","text":"Anh/chị hỏi: Điểm mạnh của em là gì?"},{"type":"speech","text":"Dạ em nghĩ điểm mạnh của em là em khá kiên nhẫn với những vấn đề dữ liệu khó. Ví dụ trong Talent Mobility, em không xử lý duplicate bằng cách xóa nhanh mà xem kỹ grain. Trong S2T, em không dừng ở việc biết model sai mà truy ngược xem sai ở bước nào. Em thấy thói quen kiểm chứng như vậy giúp kết quả đáng tin hơn."},{"type":"speech","text":"Ví dụ, trong Talent Mobility, nếu em xóa ngay mọi dòng cùng Team và Role thì pipeline có thể chạy không lỗi nhưng làm mất skill. Em chọn kiểm tra khóa nghiệp vụ trước. Tương tự ở S2T, lỗi ‘21 triệu’ thành ‘211 triệu’ cần truy ngược về transcript trước khi sửa NER."},{"type":"question","text":"Anh/chị hỏi: Em chưa có nhiều kinh nghiệm về insurance KPI, em sẽ làm gì?"},{"type":"speech","text":"Dạ đúng là em vẫn cần học sâu thêm những KPI chuyên ngành như FYP, RYP, Persistency hay Claims. Nhưng em đã có kinh nghiệm kiểm tra dữ liệu, định nghĩa chỉ số và chuẩn hóa workflow. Nếu tham gia, em sẽ ưu tiên hiểu định nghĩa KPI từ business owner, đối chiếu dữ liệu nguồn và kiểm chứng kết quả trước khi xây báo cáo hoặc model."},{"type":"question","text":"Anh/chị hỏi: Nếu manager hỏi về một việc em chưa từng làm?"},{"type":"speech","text":"Dạ phần đó em chưa trực tiếp triển khai trong dự án trước. Tuy nhiên, nếu giải quyết tình huống này thì em sẽ bắt đầu từ việc xác định yêu cầu, dữ liệu đầu vào, cách đo thành công và một baseline đơn giản; sau đó mới chọn công cụ và kiểm chứng kết quả. Em muốn phân biệt rõ kinh nghiệm thực tế với hướng em đề xuất."},{"type":"speech","text":"Ví dụ giả định, nếu được giao một bài toán churn chưa từng làm, em sẽ hỏi rõ churn được định nghĩa sau bao nhiêu ngày không gia hạn, dữ liệu có trước thời điểm dự đoán là gì và baseline ra sao, rồi mới lựa chọn thuật toán. Em sẽ nói đó là hướng em đề xuất chứ không nhận là dự án em đã hoàn thành."},{"type":"question","text":"Anh/chị hỏi: Em phối hợp với team như thế nào?"},{"type":"speech","text":"Dạ em cố gắng trình bày kết quả bằng vấn đề mà team cần giải quyết, chứ không chỉ đưa metric. Ví dụ với RCA, thay vì gửi một danh sách lỗi dài, em nhóm nguyên nhân để mọi người biết nên ưu tiên S2T hay NER. Nếu logic scoring liên quan nghiệp vụ, em sẽ cần xác nhận lại quy tắc với người hiểu dữ liệu trước khi kết luận."},{"type":"question","text":"Anh/chị hỏi: Nếu được làm lại một dự án, em sẽ cải thiện gì?"},{"type":"speech","text":"Dạ em muốn đầu tư thêm vào data validation tự động, một tập kiểm thử ổn định và cách theo dõi kết quả qua các phiên bản. Ví dụ S2T thì bổ sung entity-level checks và regression suite; Credit Score thì đánh giá thêm class imbalance, recall nhóm rủi ro và calibration. Em nghĩ hướng cải thiện phải xuất phát từ lỗi còn tồn tại chứ không chỉ thêm công nghệ mới."},{"type":"speech","text":"Ví dụ, với Credit Score, Random Forest có Accuracy 78,1% theo báo cáo, nhưng em chưa có bằng chứng về recall nhóm rủi ro hay calibration. Em muốn ưu tiên kiểm tra các metric này trước khi nói đến việc thêm một mô hình phức tạp hơn."},{"type":"question","text":"Anh/chị hỏi: Câu kết sau khi trình bày dự án?"},{"type":"speech","text":"Dạ, đó là phần chính em đã làm. Nếu anh/chị muốn đi sâu hơn, em có thể trao đổi kỹ về cách em xử lý dữ liệu, lựa chọn công nghệ hoặc cách em kiểm chứng kết quả của từng bước ạ."}]},{"id":"s11","title":"D. KỊCH BẢN ÔN NHANH TRƯỚC BUỔI PHỎNG VẤN","items":[{"type":"speech","text":"Ngày ôn cuối: em đọc một lần bài nói mở đầu; sau đó đóng tài liệu và nói lại 6 dự án, mỗi dự án 90 giây. Dành phần còn lại để tự trả lời những câu về missing values, data grain, feature engineering, train/test, leakage, model metrics và tác động cho team. Với câu nào bí, đọc phần giải thích một lần rồi thử nói lại mà không nhìn tài liệu."},{"type":"speech","text":"Điều em cần thể hiện không phải là biết hết mọi công nghệ. Quan trọng hơn là: em hiểu business problem, biết kiểm tra dữ liệu, giải thích được quyết định kỹ thuật, nhìn nhận đúng giới hạn kết quả và biết phối hợp với team."}]}]}};
const store=(()=>{try{const x=window.localStorage;x.setItem('__script_test','1');x.removeItem('__script_test');return x}catch(e){const m={};return {getItem:k=>m[k]??null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
const state={mode:store.getItem('script-mode')||'quick',section:null,search:'',font:Number(store.getItem('script-font')||17),dark:store.getItem('script-dark')==='1',focus:false};
const main=document.getElementById('main'), nav=document.getElementById('navList');
const escapeHtml=(str)=>String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');

const doc=()=>DATA[state.mode];
function sectionKey(i){return 'studied:'+state.mode+':'+i}
function isDone(i){return store.getItem(sectionKey(i))==='yes'}
function projectNum(s){const a=s.title.match(/^0([1-6])\s/);return a?Number(a[1]):null}
function shortTitle(t){return t.replace(/^0[1-6]\s+/,'').replace(/\s+—\s+(DAIICHI LIFE|INDEPENDENT PROJECT|ACADEMIC PROJECT|MWG)$/i,'')}
function countQuestions(sec){return sec.items.filter(x=>x.type==='question').length}
function getSummary(sec){let n=sec.items.find(x=>x.type==='meta'&&x.text.toUpperCase().includes('TỪ KHÓA'));return n?n.text.replace(/^TỪ KHÓA ĐỂ NHỚ\s*/i,''):sec.items.find(x=>x.type==='speech')?.text.slice(0,125)+'...' || ''}
function activeModes(){document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode))}
function updateSide(){
 activeModes();const cur=doc();nav.innerHTML='';
 cur.sections.forEach((s,i)=>{
 const btn=document.createElement('button');btn.className='navitem'+(i===state.section?' active':'')+(isDone(i)?' done':'');const num=projectNum(s);btn.innerHTML=`<span class="ni">${num?'0'+num:i===0?'00':'•'}</span><span class="nt">${escapeHtml(shortTitle(s.title))}</span>`;btn.onclick=()=>openSection(i);nav.appendChild(btn);
 });
 const n=cur.sections.filter((s,i)=>isDone(i)).length;document.getElementById('progressFill').style.width=(n/cur.sections.length*100)+'%';document.getElementById('progressMeta').textContent=`Đã ôn ${n}/${cur.sections.length} phần · ${state.mode==='quick'?'bản nhanh':'bản sâu'}`;
}
function setMode(m){state.mode=m;store.setItem('script-mode',m);state.section=null;state.search='';document.getElementById('searchInput').value='';render();}
function openSection(i){state.section=i;state.search='';document.getElementById('searchInput').value='';document.body.classList.remove('nav-open');render();window.scrollTo(0,0);}
function home(){state.section=null;state.search='';document.getElementById('searchInput').value='';render();window.scrollTo(0,0);}
function render(){updateSide();document.documentElement.style.setProperty('--font',state.font+'px');document.documentElement.classList.toggle('dark',state.dark);if(state.search){renderSearch();return;}if(state.section===null){renderHome();return;}renderSection();}
function renderHome(){document.getElementById('crumb').textContent='Tổng quan / '+(state.mode==='quick'?'Ôn nhanh':'Chuyên sâu');const sections=doc().sections;const projects=sections.map((s,i)=>({s,i})).filter(v=>projectNum(v.s));const totalQA=DATA.deep.sections.reduce((a,s)=>a+countQuestions(s),0);
 main.innerHTML=`<section class="hero"><div class="eyebrow">PREPARE · SPEAK · REMEMBER</div><h1>Ôn phỏng vấn như đang<br>trao đổi với anh/chị.</h1><p>Toàn bộ lời thoại giữ từ bản Word của bạn, chuyển thành các chương dễ đọc, các bước kỹ thuật và câu hỏi có thể <b>tự trả lời trước khi xem đáp án</b>. Ưu tiên Data Preprocessing và Feature Engineering.</p><div class="heroactions"><button class="primary-btn" id="startQuick">▶ Bắt đầu bài nói đầu tiên</button><button class="secondary-btn" id="goDeep">${state.mode==='quick'?'Xem bản chuyên sâu':'Chuyển sang bản ôn nhanh'}</button></div></section>
 <div class="metrics"><div class="metric"><strong>06</strong><span>Dự án cần kể rõ</span></div><div class="metric"><strong>${totalQA}</strong><span>Câu hỏi đào sâu</span></div><div class="metric"><strong>02</strong><span>Cách học nhanh và sâu</span></div></div>
 <div class="sectionheading"><h2>Chọn dự án để luyện</h2><small>Nên học bản nhanh trước, rồi mới mở chuyên sâu</small></div><div class="project-grid">${projects.map(({s,i})=>`<button class="project-tile ${isDone(i)?'done':''}" data-open="${i}"><span class="project-id">DỰ ÁN 0${projectNum(s)} ${isDone(i)?'· ĐÃ ÔN':''}</span><strong>${escapeHtml(shortTitle(s.title))}</strong><p>${escapeHtml(getSummary(s)).slice(0,230)}</p><span class="tile-foot">Mở lời thoại và luyện nói →</span></button>`).join('')}</div>
 <div class="reflection-highlight"><div><span class="reflection-eyebrow">MỤC MỚI • SAU KHI KỂ XONG DỰ ÁN</span><h3>Góc nhìn của em — nói có ví dụ, có lý do</h3><p>Vì sao Preprocessing và Feature Engineering quan trọng? Mỗi quan điểm đều đi cùng tình huống cụ thể và tác động đối với team.</p></div><button id="goReflection" class="primary-btn">Luyện đoạn kết →</button></div>
 <div class="sectionheading"><h2>Phần cần nhớ trước khi phỏng vấn</h2></div><div class="speeches"><div class="speech-top">CÁCH HỌC TỐI ƯU THỜI GIAN</div><p>Đầu tiên, em nhớ chuỗi: <strong>Vấn đề → Em đã làm gì → Dùng công nghệ thế nào → Khó khăn → Kết quả → Giúp team ra sao.</strong></p><p>Sau đó, em tự trả lời câu hỏi <strong>“Tại sao em chọn cách này?”</strong> bằng một ví dụ cụ thể từ dự án. Nếu chưa chắc, mở phần chuyên sâu để luyện lại.</p></div><div class="footer">Script từ bản Word và phần ví dụ/góc nhìn mới bổ sung · Dữ liệu lưu tiến độ trên trình duyệt này</div>`;
 document.getElementById('startQuick').onclick=()=>openSection(state.mode==='quick'?1:2);
 document.getElementById('goDeep').onclick=()=>setMode(state.mode==='quick'?'deep':'quick');document.getElementById('goReflection').onclick=()=>openSection(doc().sections.findIndex(v=>v.id==='reflection'));main.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openSection(+el.dataset.open));
}
function groupItems(items){
 const output=[];let current=null;let last=null;
 const push=()=>{if(current&&current.nodes.length)output.push(current);current=null;last=null};
 for(const item of items){const t=item.type;
 if(t==='h2'){push();current={title:item.text,nodes:[]};continue}
 if(!current)current={title:null,nodes:[]};
 if(t==='h3'){last={type:'step',title:item.text,parts:[]};current.nodes.push(last);continue}
 if(t==='question'){last={type:'qa',title:item.text,parts:[]};current.nodes.push(last);continue}
 if(t==='speech'&&(last?.type==='step'||last?.type==='qa')){last.parts.push(item.text);continue}
 if(t==='speech'){const prev=current.nodes.at(-1);if(prev?.type==='speech'){prev.parts.push(item.text)}else current.nodes.push({type:'speech',parts:[item.text]});last=null;continue}
 current.nodes.push({type:t,parts:[item.text]});last=null;
 }
 push();return output;
}
const SPEECH=(parts,em=false)=>`<div class="speeches ${em?'emphasized':''}"><div class="speech-top"><span>✳ LỜI THOẠI XƯNG EM</span><button class="copy-mini" data-copy="${attrs(parts.join('\n\n'))}">Sao chép ↗</button></div>${parts.map(t=>`<p class="${/^(Ví dụ|Để dễ hình dung|Theo em, kết quả model|Ví dụ trực tiếp)/i.test(t)?'spoken-example':''}">${escapeHtml(t)}</p>`).join('')}</div>`;
const DETAILS=(node)=>`<details class="detail ${node.type}"><summary>${escapeHtml(node.title)}</summary><div class="detail-answer">${node.type==='qa'?'<div class="qa-prefix">CÁCH TRẢ LỜI</div>':''}${node.parts.map(t=>`<p>${escapeHtml(t)}</p>`).join('')}<div class="answer-toolbar"><button class="copy-mini" data-copy="${attrs(node.parts.join('\n\n'))}">Sao chép câu trả lời ↗</button></div></div></details>`;
function renderGroup(g){return `<section class="read-section">${g.title?`<div class="h2-head"><h2>${escapeHtml(g.title)}</h2></div>`:''}${g.nodes.map(node=>{if(node.type==='speech')return SPEECH(node.parts,/Bài nói|Mở đầu/i.test(g.title||''));if(node.type==='qa'||node.type==='step')return DETAILS(node);if(node.type==='meta')return `<div class="meta-note ${node.parts[0].toUpperCase().includes('TỪ KHÓA')?'keywords':''}">${escapeHtml(node.parts[0].replace(/^(TỪ KHÓA ĐỂ NHỚ|GHI NHỚ)\s*/i,''))}</div>`;return `<div class="normal-text">${escapeHtml(node.parts.join('\n'))}</div>`}).join('')}</section>`}
function bindCopy(){main.querySelectorAll('[data-copy]').forEach(el=>el.onclick=async()=>{try{await navigator.clipboard.writeText(el.dataset.copy);const old=el.textContent;el.textContent='✓ Đã sao chép';setTimeout(()=>el.textContent=old,1400)}catch(e){fallbackCopy(el.dataset.copy);}})}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
function renderSection(){const sec=doc().sections[state.section];document.getElementById('crumb').textContent=(state.mode==='quick'?'Ôn nhanh':'Chuyên sâu')+' / '+shortTitle(sec.title);const groups=groupItems(sec.items);const prior=state.section>0?state.section-1:null,next=state.section<doc().sections.length-1?state.section+1:null;
 const spoken=sec.items.filter(x=>x.type==='speech').map(x=>x.text).join('\n\n');const wordcount=spoken.split(/\s+/).filter(Boolean).length;const number=projectNum(sec);
 main.innerHTML=`<div class="read-top content-wrap"><button class="back" id="backBtn">← Trở về tổng quan</button><div class="eyebrow" style="margin-top:15px">${state.mode==='quick'?'KỊCH BẢN ÔN NHANH':'SCRIPT CHUYÊN SÂU'}${number?' · DỰ ÁN 0'+number:''}</div><h1>${escapeHtml(sec.title)}</h1><div class="read-desc">Luyện nói như đang trao đổi với anh/chị phỏng vấn. Các mục kỹ thuật và câu hỏi có thể mở khi cần; ưu tiên hiểu ví dụ, không cần học thuộc từng chữ.</div><div class="read-stats"><span>${wordcount.toLocaleString('vi-VN')} từ</span><span>${countQuestions(sec)} câu hỏi</span><span>${groups.length} nhóm nội dung</span></div><div class="read-controls"><button class="section-done ${isDone(state.section)?'checked':''}" id="markDone">${isDone(state.section)?'Đã ôn phần này':'○ Đánh dấu đã ôn'}</button><button class="outlinebutton" id="openAll">Mở tất cả câu hỏi</button><button class="outlinebutton" id="closeAll">Thu gọn câu hỏi</button><button class="outlinebutton" id="copySection">Sao chép lời thoại</button></div></div><div class="content-wrap">${groups.map(renderGroup).join('')}<section class="notes-area"><h3>Ghi chú khi luyện nói</h3><p>Viết các ý chưa chắc, câu hỏi manager có thể hỏi hoặc ví dụ bạn muốn nhớ. Ghi chú chỉ lưu trên trình duyệt hiện tại.</p><textarea id="noteText" placeholder="Ví dụ: em cần giải thích rõ hơn vì sao chọn median thay vì mean...">${escapeHtml(store.getItem('note:'+state.mode+':'+state.section)||'')}</textarea></section><div class="bottomnav"><button class="outlinebutton" id="prevBtn" ${prior===null?'disabled':''}>← Phần trước</button><button class="primary-btn" id="nextBtn" ${next===null?'disabled':''}>Phần tiếp →</button></div><div class="footer">Lời thoại từ bản Word được bổ sung ví dụ và góc nhìn mới · Không nhận tình huống giả định là kinh nghiệm thực tế</div></div>`;
 main.querySelector('#backBtn').onclick=home;main.querySelector('#markDone').onclick=()=>{store.setItem(sectionKey(state.section),isDone(state.section)?'no':'yes');renderSection();updateSide()};main.querySelector('#openAll').onclick=()=>main.querySelectorAll('details').forEach(d=>d.open=true);main.querySelector('#closeAll').onclick=()=>main.querySelectorAll('details').forEach(d=>d.open=false);main.querySelector('#copySection').onclick=()=>{(navigator.clipboard?.writeText(spoken)||Promise.reject()).catch(()=>fallbackCopy(spoken))};main.querySelector('#noteText').oninput=e=>store.setItem('note:'+state.mode+':'+state.section,e.target.value);main.querySelector('#prevBtn').onclick=()=>prior!==null&&openSection(prior);main.querySelector('#nextBtn').onclick=()=>next!==null&&openSection(next);bindCopy();
}
function renderSearch(){const term=state.search.trim().toLocaleLowerCase('vi');document.getElementById('crumb').textContent='Tìm kiếm / '+state.search;const matches=[];for(const [mode,collection] of Object.entries(DATA)){for(let i=0;i<collection.sections.length;i++){const sec=collection.sections[i];for(let j=0;j<sec.items.length;j++){const item=sec.items[j];if(item.text.toLocaleLowerCase('vi').includes(term)){matches.push({mode,i,j,sec,item});}}}}
 const results=matches.slice(0,80);main.innerHTML=`<div class="search-head"><button class="outlinebutton" id="clearSearch">← Quay lại</button></div><div class="eyebrow">TÌM TRONG CẢ HAI BẢN SCRIPT</div><h1 style="margin:8px 0 3px;font-size:28px;letter-spacing:-.8px">“${escapeHtml(state.search)}”</h1><p style="font-size:13px;color:var(--sub);margin-bottom:24px">${matches.length} kết quả phù hợp${matches.length>80?' · hiển thị 80 kết quả đầu tiên':''}</p>${results.length?results.map(m=>`<button class="search-result" data-mode="${m.mode}" data-i="${m.i}"><div class="source">${m.mode==='deep'?'CHUYÊN SÂU':'ÔN NHANH'} · ${escapeHtml(shortTitle(m.sec.title))}</div><strong>${escapeHtml(m.item.type==='question'?'Câu hỏi':m.item.type==='h3'?'Kỹ thuật':m.item.type==='speech'?'Lời thoại':'Nội dung')}</strong><p>${escapeHtml(m.item.text).slice(0,340)}${m.item.text.length>340?'…':''}</p></button>`).join(''):`<div class="search-empty">Không tìm thấy kết quả. Hãy thử từ khóa ngắn hơn, chẳng hạn “duplicate”, “median”, “Random Forest” hoặc “training”.</div>`}`;
 main.querySelector('#clearSearch').onclick=()=>{state.search='';document.getElementById('searchInput').value='';render()};main.querySelectorAll('.search-result').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.section=Number(b.dataset.i);state.search='';document.getElementById('searchInput').value='';render();window.scrollTo(0,0)});
}
function initPrompter(){if(state.section===null){openSection(0)}const sec=doc().sections[state.section];const spokenGroups=groupItems(sec.items).filter(g=>g.nodes.some(n=>n.type==='speech'));const content=spokenGroups.map(g=>`<h2>${escapeHtml(g.title||'Lời thoại')}</h2>`+g.nodes.filter(n=>n.type==='speech').flatMap(n=>n.parts.map(p=>`<p>${escapeHtml(p)}</p>`)).join('')).join('');document.getElementById('prompterTitle').textContent=sec.title;document.getElementById('prompter-content').innerHTML=content;document.getElementById('prompter-scroller').scrollTop=0;document.body.classList.add('prompter-open');stopScroll();}
let lastScroll=0,playing=false,raf=null;
function scrollTick(t){if(!playing)return;let elapsed=lastScroll?Math.min(100,t-lastScroll):16;lastScroll=t;const speed=Number(document.getElementById('speed').value);const scroller=document.getElementById('prompter-scroller');scroller.scrollTop+=((.20+speed*.12)*elapsed/16);if(scroller.scrollTop+scroller.clientHeight>=scroller.scrollHeight-3){stopScroll();return}raf=requestAnimationFrame(scrollTick)}
function stopScroll(){playing=false;lastScroll=0;if(raf)cancelAnimationFrame(raf);document.getElementById('prompterPlay').textContent='▶ Tự cuộn';document.getElementById('prompterPlay').classList.remove('on')}
function toggleScroll(){if(playing){stopScroll();return}playing=true;lastScroll=0;document.getElementById('prompterPlay').textContent='Ⅱ Tạm dừng';document.getElementById('prompterPlay').classList.add('on');raf=requestAnimationFrame(scrollTick)}
function closePrompter(){stopScroll();document.body.classList.remove('prompter-open')}
document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.getElementById('backHome').onclick=home;document.getElementById('menuBtn').onclick=()=>document.body.classList.toggle('nav-open');document.getElementById('mask').onclick=()=>document.body.classList.remove('nav-open');document.getElementById('searchInput').oninput=e=>{state.search=e.target.value.trim();render();window.scrollTo(0,0)};document.getElementById('bigger').onclick=()=>{state.font=Math.min(24,state.font+1);store.setItem('script-font',state.font);render()};document.getElementById('smaller').onclick=()=>{state.font=Math.max(14,state.font-1);store.setItem('script-font',state.font);render()};document.getElementById('themeBtn').onclick=()=>{state.dark=!state.dark;store.setItem('script-dark',state.dark?'1':'0');render()};document.getElementById('focusBtn').onclick=()=>{state.focus=!state.focus;document.body.classList.toggle('reader-only',state.focus);document.body.classList.remove('nav-open')};document.getElementById('prompterBtn').onclick=initPrompter;document.getElementById('prompterPlay').onclick=toggleScroll;document.getElementById('prompterClose').onclick=closePrompter;document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePrompter();document.body.classList.remove('nav-open')}if(e.key==='/'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();document.getElementById('searchInput').focus();document.body.classList.add('nav-open')}});render();
</script>
