/* ===== v2: individual project mind maps & data foundations ===== */
.pm-header{display:flex;flex-wrap:wrap;align-items:start;justify-content:space-between;gap:12px;margin-bottom:14px}
.pm-header h3{margin:3px 0 4px;font-size:19px;letter-spacing:-.45px}
.pm-header p{margin:0;font-size:12px;color:var(--muted);max-width:670px}
.pm-actions{display:flex;gap:7px;flex-wrap:wrap}
.pm-select{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0 19px}
.pm-select button{border:1px solid #dce5ed;background:white;color:#466079;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:750;transition:.15s}
.pm-select button.active,.pm-select button:hover{background:#17334f;color:#fff;border-color:#17334f}
.pm-canvas{height:570px;position:relative;border:1px solid #dce9ef;border-radius:15px;overflow:hidden;background:radial-gradient(ellipse at center,#f0faf9 0%,#f6f9fd 50%,#fff 100%)}
.pm-canvas::before{content:'';position:absolute;inset:0;background-image:radial-gradient(#abc4d355 .75px,transparent .75px);background-size:21px 21px;pointer-events:none}
.pm-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pm-root,.pm-branch{position:absolute;z-index:2;box-shadow:0 6px 21px #16354a16;border-radius:13px}
.pm-root{left:50%;top:50%;transform:translate(-50%,-50%);background:#173750;color:white;width:190px;min-height:128px;padding:16px;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column}
.pm-root .pm-root-icon{font-size:26px;line-height:1.3}
.pm-root strong{font-size:13px;line-height:1.4;margin-top:7px}
.pm-root small{font-size:10px;opacity:.74;margin-top:6px}
.pm-branch{width:236px;min-height:86px;padding:11px 12px;text-align:left;transform:translate(-50%,-50%);background:white;border:1px solid #dce7ee;color:#18324a;display:flex;gap:10px;align-items:flex-start;transition:transform .15s,border-color .15s,box-shadow .15s}

 decisions:[{q:"Vì sao dùng Python cho log parsing?",a:"Python phù hợp khi log chứa cấu trúc phức tạp hoặc định dạng thay đổi; SQL tiếp tục dùng cho truy vấn nguồn. Không có nghĩa SQL không thể parse JSON."},{q:"Đếm request/phút có bằng concurrency không?",a:"Không. Request arrival rate là tốc độ đến; concurrency cần khoảng thời gian request đang xử lý hoặc định nghĩa active session."},{q:"Vì sao validate sau parsing?",a:"Một log lỗi có thể biến thành NULL hoặc mất bản ghi, khiến KPI sai mà không báo lỗi."}],
 challenges:[{p:"Log chứa thông tin trong một cột",s:"Dùng Python để tách thành các field riêng.",l:"Structured fields mới hỗ trợ phân tích tốt."},{p:"Định nghĩa concurrency",s:"Kiểm tra có start/end timestamps hay active-session event không; nếu thiếu chỉ báo cáo proxy có tên chính xác.",l:"KPI phải đúng định nghĩa và dữ liệu nguồn."}],
 results:[{a:"Nguồn",b:"IBM Db2 · OCR staging",n:"Truy vấn SQL; phân tách log bằng Python."},{a:"Nhóm phân tích",b:"Request trends · Concurrency",n:"Ngày/tháng/năm và hoạt động đồng thời; chưa có KPI định lượng hiệu quả."}],
 cautions:["Chưa chứng minh đã xây dashboard production từ task này.","Các KPI latency/error rate chỉ nên nêu như hướng bổ sung khi dữ liệu hỗ trợ.","CDC SQL Server → Db2 là bối cảnh kiến trúc bạn mô tả, chưa xác nhận mọi chi tiết pipeline OCR staging."],
 pitch:"I worked on an AI service analytics task where the source data came from an OCR staging table in IBM Db2. I used SQL to extract the data, then Python to parse a semi-structured log column into separate fields. This made the records suitable for analysis of request volumes by day, month and year, along with concurrent activity. The main contribution was turning technical service logs into more usable operational data for the team.",
 questions:[{q:"How did you use SQL and Python together?",a:"SQL was used to retrieve the staging records from Db2. Python handled parsing and transforming the log content into analysis-ready fields.",deep:"Nếu log là JSON chuẩn, bạn có thể parse ngay trong Db2 không?"},{q:"How would you validate parsed logs?",a:"Check schema, required fields, parse failures, invalid timestamps, and reconcile input row counts with processed output.",deep:"Nếu một request sinh nhiều log events thì count như thế nào?"},{q:"How do you calculate concurrent requests?",a:"You need overlapping active intervals, usually start/end times. Counts per minute alone show traffic, not true concurrency.",deep:"Làm sao tính peak concurrency bằng sweep-line events?"},{q:"How did the task help your team?",a:"It made usage trends and concurrent activity easier to analyze instead of inspecting semi-structured log records individually.",deep:"Bạn đã đo trực tiếp tiết kiệm bao nhiêu giờ chưa?"}]
},

 id:"talent",icon:"🧩",name:"Talent Mobility & Workforce Analytics",place:"Daiichi Life Việt Nam",focus:"Data Quality · Grain · Matching · Streamlit",bi:3,ds:2,color:"purple",time:"Ưu tiên cao • 30 phút",
 problem:"Luân chuyển nhân sự giữa Agile teams đòi hỏi đánh giá năng lực nhân viên và yêu cầu vị trí. Dữ liệu nhiều bảng, thiếu mapping hoặc duplicate có thể làm scoring sai.",
 objective:"Tạo workflow phân tích năng lực/role để xác định role similarity, skill gaps, readiness và candidates cho rotation planning.",
 team:["Có cơ sở kiểm tra chất lượng dữ liệu trước khi đưa vào scoring.","Giảm nguy cơ đánh giá sai do duplicate và mapping sai.","Đơn giản hóa dependency còn hai bảng phân tích chính.","Có prototype Streamlit cho xem skill gaps và candidate matching."],
 business:"Hỗ trợ người quản lý xem xét luân chuyển và phát triển năng lực dựa trên tiêu chí nhất quán; chưa xác nhận adoption/impact production.",
 concepts:[{t:"Data Grain",d:"Một dòng đại diện cho đúng đối tượng gì và ở mức chi tiết nào.",e:"Một dòng Role_Skill_Master có thể là một skill của một role trong team.",w:"Xóa duplicate và group đúng mà không mất thông tin."},{t:"Business Key",d:"Một hoặc nhiều trường giúp phân biệt bản ghi theo ý nghĩa nghiệp vụ.",e:"Team + Role + Skill Code là ứng viên key, cần xem thêm thuộc tính có ý nghĩa.",w:"Phân biệt repeated skill hợp lệ với duplicate."},{t:"Duplicate",d:"Bản ghi lặp lại theo grain/key xác định; không phải cứ cùng role là trùng.",e:"SQL và Python cùng role là 2 skills hợp lệ.",w:"Tránh xóa mất kỹ năng yêu cầu."},{t:"Data Validation",d:"Kiểm tra schema, định dạng, range, khóa và tính hợp lệ của dữ liệu.",e:"Required Level ngoài thang 1–5 thì gắn cờ điều tra.",w:"Chất lượng scoring phụ thuộc vào input."},{t:"Skill Gap",d:"Chênh lệch giữa yêu cầu vị trí và năng lực nhân viên.",e:"Role cần Python 4; assessment 3 → thiếu 1.",w:"Gợi ý kỹ năng cần phát triển."},{t:"Role Similarity",d:"Độ gần nhau về yêu cầu kỹ năng của hai vai trò.",e:"Data Analyst và BI Analyst có nhiều skill yêu cầu tương tự.",w:"Tìm hướng luân chuyển tiềm năng."},{t:"Rule-based Scoring",d:"Dùng công thức/trọng số có sẵn để chấm thay vì train ML model.",e:"Weighted sum của mức đạt yêu cầu trên target skills.",w:"Dễ giải thích hơn, nhưng phụ thuộc giả định về trọng số."}],
 stack:[{t:"Power Query",h:"Group By + Count Rows để điều tra duplicate và grain.",why:"Kiểm tra nhanh cấu trúc nguồn, tránh loại bỏ nhầm."},{t:"Python / Pandas",h:"Data processing, validation, scoring logic và pipeline V6.",why:"Lặp lại các phép tính và xử lý có hệ thống."},{t:"2-table Data Model",h:"Talent_Mobility_Fact + Role_Skill_Master.",why:"Giảm dependency không cần thiết cho phép tính."},{t:"Streamlit",h:"Dựng giao diện exploration và matching.",why:"Hiển thị kết quả Python cho người dùng nghiệp vụ."}],
 preprocess:{done:["Chuẩn bị môi trường Windows của công ty bằng requirements.txt.","Kiểm tra column names, Skill Code, Required Level, Assessment Score.","Dùng Power Query Group By / Count Rows điều tra duplicate.","Phân biệt duplicate thật với các dòng nhiều skill trên cùng role.","Giữ dữ liệu có nghĩa và rút pipeline xuống hai bảng."],learn:["Unique constraints và data-quality tests theo grain.","Kiểm tra mapping skill ID/code, missing score, invalid scale.","Theo dõi records bị loại và lý do loại để audit."]},
 features:{done:["Skill Gap", "Readiness", "Role Similarity", "Candidate Matching", "Missing Skills"],note:"Các chỉ số trên là derived analytical scores/rules, không phải output của supervised Machine Learning."},
 flow:[{a:"Business requirements",b:"So khớp năng lực hiện tại với yêu cầu target role."},{a:"Source validation",b:"Kiểm tra table/columns, skill code, levels, assessment."},{a:"Investigate duplicates",b:"Group By theo business attributes, xác định grain hợp lệ."},{a:"Two-table pipeline",b:"Talent_Mobility_Fact và Role_Skill_Master."},{a:"Python scoring",b:"Role similarity → candidate matching → skill gap → rotation suggestions."},{a:"Streamlit",b:"Explore candidate fit, gaps và readiness."}],
 decisions:[{q:"Vì sao không drop duplicate theo Team/Role?",a:"Một role có nhiều skills hợp lệ; xóa theo Team/Role sẽ làm mất các skill requirements."},{q:"Vì sao chỉ hai bảng?",a:"Với scoring hiện tại, hai bảng chứa đủ dữ liệu cần thiết và ít dependency hơn; nhưng không có nghĩa mọi data warehouse nên chỉ dùng hai bảng."},{q:"Đây có phải Machine Learning không?",a:"Không nếu chỉ tính toán bằng công thức có trọng số và rules định sẵn; gọi là rule-based analytics."},{q:"Làm sao kiểm chứng fairness của matching?",a:"Thử với các cases biên, kiểm tra ảnh hưởng trọng số, dữ liệu thiếu và đánh giá cùng quy tắc giữa nhân viên."}],
 challenges:[{p:"Duplicate trong Role Skill Master",s:"Power Query Group By theo các business attributes rồi chỉ xử lý duplicate thực sự.",l:"Xác định grain trước cleaning."},{p:"Many-table dependency",s:"Refactor pipeline để dùng Talent_Mobility_Fact và Role_Skill_Master.",l:"Thiết kế đủ cho bài toán hiện tại; không over-engineer."},{p:"Schema mismatch",s:"Kiểm tra Skill Code, Required Level, Assessment Score trước tính toán.",l:"Validation trước business logic."}],
 results:[{a:"Data architecture",b:"Rút gọn còn 2 bảng",n:"Theo pipeline V6 được mô tả."},{a:"Pipeline testing",b:"8 tests trên dummy data",n:"Chưa xác nhận full production chạy thành công với toàn bộ dữ liệu thật."}],
 cautions:["Chưa gọi platform là production-ready chỉ vì chạy được dummy data.","Không gọi rule-based scoring là ML training.","Các trọng số/công thức cuối cần được kiểm chứng với team trước khi tuyên bố fair hoặc optimized."],
 pitch:"I worked on a workforce analytics solution to support potential employee rotation across Agile teams. The business goal was to compare current employee capabilities against target-role requirements. My main contributions were data validation, investigating duplicates at the correct business grain, and simplifying a multi-table analytics pipeline into two core inputs. We used Python for skill-gap, readiness and matching logic, with a Streamlit interface for exploration. This helped create a more consistent basis for workforce analysis, although the final pipeline had not yet been confirmed in full production.",
 questions:[{q:"What does data grain mean in your project?",a:"The grain tells us what each row represents. In Role Skill Master, a role may have many skill rows; therefore repeating Team/Role is not automatically a duplicate.",deep:"Nếu cùng Team/Role/Skill Code mà Required Level khác nhau thì sao?"},{q:"Why did you investigate duplicates with Power Query?",a:"Grouping by the relevant business attributes helped distinguish true identical duplicates from legitimate repeated roles with different skills.",deep:"Bạn chọn key theo business hay kỹ thuật?"},{q:"How did you calculate candidate matching?",a:"We compared an employee's assessed capabilities with target-role skill requirements, applying defined rules and weights, then examined skill gaps and readiness.",deep:"Nếu thiếu assessment cho một skill quan trọng thì cho 0 hay NULL?"},{q:"Is this machine learning?",a:"It is primarily rule-based and weighted analytics rather than a trained predictive model.",deep:"Khi nào bạn cân nhắc học máy cho recommendation?"},{q:"How did the work help the team?",a:"It improved input-data reliability and gave a simpler, more consistent way to examine capabilities, role similarity and development gaps.",deep:"Bạn đã đo adoption hay outcome của rotation chưa?"}]
},

gin-top:16px"><div class="card span-6"><h3>Nhánh BI → Decision Support</h3><p class="small muted">MWG: raw data → Python → Excel; AI Logs: Db2 → Python parsing → KPI; Talent: data grain → cleaning → scoring → Streamlit.</p></div><div class="card span-6"><h3>Nhánh DS → Model Evaluation</h3><p class="small muted">Call: survey → benchmark → RCA → prompt test; Credit: preprocessing → features → classification; Housing: regression → FastAPI → React.</p></div></section>`}

];return `<div class="eyebrow">HIGH-YIELD MODE</div><h2 class="headline">Ôn gấp nhưng học sâu</h2><p class="lead">Đừng cố đọc hết nội dung tuần tự. Ưu tiên giải thích được “Tại sao → Tôi làm gì → Bằng cách nào → Kết quả → Giúp team thế nào?”, sau đó tập trung phần chưa nhớ.</p><section class="grid"><div class="card span-7"><h3>Chu kỳ 25 phút / dự án</h3><div class="action-list"><div class="action"><div class="number">3′</div><div><b>Mind Map</b><p>Nhìn mạch dự án, sau đó tắt đi và tự nhớ.</p></div></div><div class="action"><div class="number">7′</div><div><b>English 90-second pitch</b><p>Tự nói không nhìn đáp án; thiếu gì thì mở đúng phần đó.</p></div></div><div class="action"><div class="number">10′</div><div><b>How & Why</b><p>Đào sâu 2 quyết định kỹ thuật, preprocessing và một giới hạn.</p></div></div><div class="action"><div class="number">5′</div><div><b>Recall & Quiz</b><p>Đánh dấu chưa nhớ rồi quay lại vào ngày kế tiếp.</p></div></div></div></div><div class="card span-5"><h3>Focus timer</h3><div style="font-size:64px;font-weight:850;letter-spacing:-3px;text-align:center;margin:21px 0 10px;font-variant-numeric:tabular-nums" id="timerDisplay">${clock(state.timerSeconds)}</div><div class="btnrow" style="justify-content:center"><button class="btn" id="timerToggle">${state.timerRunning?'Tạm dừng':'Bắt đầu 25 phút'}</button><button class="btn secondary" id="timerReset">Đặt lại</button></div><p class="small muted" style="text-align:center;margin-top:12px">Không cần hoàn hảo; kết thúc vòng là tự nói lại câu chuyện dự án.</p></div></section>

const flashDeck=()=>P.flatMap(p=>p.concepts.slice(0,6).map((c,i)=>({id:`${p.id}-${i}`,project:p.id,front:`${c.t} là gì? Vì sao dùng?`,back:`${c.d}\nVí dụ: ${c.e}`})));
function currentFlashList(){let deck=flashDeck();if(state.role==='bi')deck=deck.filter(x=>P.find(p=>p.id===x.project).bi>=2);if(state.role==='ds')deck=deck.filter(x=>P.find(p=>p.id===x.project).ds>=2);if(state.flashFilter==='weak')deck=deck.filter(x=>state.flashRatings[x.id]==='hard');if(state.flashFilter==='new')deck=deck.filter(x=>!state.flashRatings[x.id]);return deck}
function flash(){const deck=currentFlashList();state.flashIndex=Math.min(state.flashIndex,Math.max(0,deck.length-1));const x=deck[state.flashIndex];const stats={know:Object.values(state.flashRatings).filter(x=>x==='know').length,hard:Object.values(state.flashRatings).filter(x=>x==='hard').length};return `<div class="eyebrow">ACTIVE RECALL</div><h2 class="headline">Flashcards — Nhớ mà không nhìn đáp án</h2><p class="lead">Nhìn mặt trước, <b>nói thành tiếng</b> định nghĩa + ví dụ thực tế, rồi mới bấm lật. Những thẻ “Chưa nhớ” sẽ được lọc ra để ôn lại. Việc đánh giá lưu trên trình duyệt này.</p><div class="tagrow"><button class="tab ${state.flashFilter==='all'?'active':''}" data-flash-filter="all">Tất cả (${flashDeck().length})</button><button class="tab ${state.flashFilter==='weak'?'active':''}" data-flash-filter="weak">Cần ôn (${stats.hard})</button><button class="tab ${state.flashFilter==='new'?'active':''}" data-flash-filter="new">Chưa xem</button></div><div class="flash-zone"><div class="card"><h3>Ôn chủ động</h3><p class="small muted">Mỗi thẻ nên trả lời đủ 3 ý:</p>${list(["Định nghĩa thật đơn giản","Tại sao cần dùng","Ví dụ trong dự án của mình"])}<div class="sep"></div><div class="stat-val">${stats.know} <span class="muted" style="font-size:13px;font-weight:500">thẻ đã nhớ</span></div><div class="stat-val">${stats.hard} <span class="muted" style="font-size:13px;font-weight:500">thẻ cần ôn</span></div><p class="footnote">Chế độ theo BI/DS trong thanh trên cũng lọc bộ thẻ.</p></div><div class="card"><div class="resume-bar" style="justify-content:space-between"><b>${deck.length?`Thẻ ${state.flashIndex+1}/${deck.length}`:'Không có thẻ phù hợp'}</b><span class="pill">${x?esc(P.find(p=>p.id===x.project).name):''}</span></div>${x?`<div class="progress-dots">${deck.slice(0,40).map((_,i)=>`<i class="${i===state.flashIndex?'current':i<state.flashIndex?'done':''}"></i>`).join('')}</div><div class="flash ${state.flashRevealed?'revealed':''}" id="flashCard" role="button" tabindex="0"><div><small>${state.flashRevealed?'MẶT SAU — ĐÁP ÁN':'MẶT TRƯỚC — CÂU HỎI'}</small><div class="front">${esc(x.front)}</div><div class="back">${esc(x.back).replace(/\n/g,'<br>')}</div></div><small>${state.flashRevealed?'Đã tự giải thích được chưa?':'Bấm để lật · tự nói trước khi lật'}</small></div><div class="flash-tools"><button class="btn secondary smallbtn" id="flashPrev" ${state.flashIndex===0?'disabled':''}>← Trước</button><button class="btn ghost smallbtn" id="flashFlip">${state.flashRevealed?'Ẩn đáp án':'Lật đáp án'}</button><button class="btn smallbtn" style="background:#b97539" data-rate="hard" ${!state.flashRevealed?'disabled':''}>× Chưa nhớ</button><button class="btn smallbtn" data-rate="know" ${!state.flashRevealed?'disabled':''}>✓ Đã nhớ</button><button class="btn secondary smallbtn" id="flashNext">Tiếp →</button></div>`:'<div class="empty">Bạn đã xem hết thẻ theo bộ lọc này. Chọn “Tất cả” hoặc đổi BI/DS để học tiếp.</div>'}</div></div>`}
function glossary(){const cats=['Tất cả',...new Set(GLOSSARY.map(x=>x[0]))];const entries=state.termFilter==='Tất cả'?GLOSSARY:GLOSSARY.filter(x=>x[0]===state.termFilter);return `<div class="eyebrow">FOUNDATIONS</div><h2 class="headline">Technical Concepts — Định nghĩa dễ hiểu</h2><p class="lead">Những thuật ngữ xuất hiện trong dự án và Principal Accountabilities. Định nghĩa ngắn để nhớ, sau đó mở dự án tương ứng để xem cách áp dụng.</p><div class="step-tabs">${cats.map(cat=>`<button class="tab ${state.termFilter===cat?'active':''}" data-term="${esc(cat)}">${esc(cat)}</button>`).join('')}</div><div class="glossary-grid" style="margin-top:17px">${entries.map(([cat,term,def,where])=>`<div class="term"><span class="pill">${esc(cat)}</span><b style="margin-top:8px">${esc(term)}</b><p>${esc(def)}</p><em>Liên hệ: ${esc(where)}</em></div>`).join('')}</div>`}
function jd(){let groups=JD.filter(x=>state.role==='both'||x.role===state.role);return `<div class="eyebrow">PRINCIPAL ACCOUNTABILITIES</div><h2 class="headline">Hai JD đang thực sự yêu cầu gì?</h2><p class="lead">Lấy từng trách nhiệm công việc và ghép với ví dụ thật của bạn. Những chỗ trống là kiến thức cần học, không phải thành tích phải bịa thêm.</p><div class="grid">${groups.map(g=>`<div class="card span-6"><span class="pill ${g.role==='bi'?'teal':'purple'}">${g.role==='bi'?'Data/BI Analyst':'Data Scientist'}</span><h3 style="margin-top:10px">${esc(g.group)}</h3>${g.items.map(([task,evidence,note])=>`<div class="jd-line"><strong>${esc(task)}</strong><p>✓ Ví dụ liên quan: ${esc(evidence)}</p><p style="color:#a16d40">⚑ Lưu ý: ${esc(note)}</p></div>`).join('')}</div>`).join('')}</div><section class="card" style="margin-top:15px"><h3>3 vùng kiến thức còn cần học thêm</h3><div class="two-col"><div><b class="small">Data/BI Analyst</b>${list(["Insurance KPIs: FYP, RYP, persistency, conversion, claims.","KPI definition, denominators, weighted metrics.","Campaign measurement và incremental uplift."])}</div><div><b class="small">Data Scientist</b>${list(["Statistics, A/B testing và confidence intervals.","Model calibration, explainability, drift.","Frequency, severity và time-to-event modeling."])}</div></div></section>`}
function quizStart(){state.quiz=[...QUIZ].sort(()=>Math.random()-.5).slice(0,10);state.quizIndex=0;state.quizScore=0;state.quizSelected=null}
function quiz(){if(!state.quiz.length)quizStart();if(state.quizIndex>=state.quiz.length)return `<div class="eyebrow">KNOWLEDGE CHECK</div><h2 class="headline">Kết quả kiểm tra</h2><section class="card" style="max-width:780px"><div class="stat-val">${state.quizScore}/${state.quiz.length} câu đúng</div><p class="muted">${state.quizScore>=8?'Nền tảng tốt. Tiếp theo nên mock interview để luyện diễn đạt.':'Xem lại những khái niệm chưa chắc, sau đó thử đề khác.'}</p><div class="btnrow"><button class="btn" id="quizRestart">Làm bộ 10 câu khác</button><button class="btn secondary" data-go="flash">Ôn Flashcards</button></div></section>`;const x=state.quiz[state.quizIndex];const chosen=state.quizSelected;return `<div class="eyebrow">KNOWLEDGE CHECK</div><h2 class="headline">Quiz — Tự kiểm tra</h2><p class="lead">10 câu ngẫu nhiên; chọn đáp án và đọc giải thích. Mục tiêu không phải đoán đúng mà là hiểu vì sao các lựa chọn khác sai.</p><div class="card" style="max-width:850px"><div class="resume-bar" style="justify-content:space-between"><span class="pill">Câu ${state.quizIndex+1}/${state.quiz.length}</span><span class="pill teal">Đúng ${state.quizScore}</span></div><div class="bar" style="background:#e7eef4"><i style="width:${state.quizIndex/state.quiz.length*100}%"></i></div><h3 style="font-size:20px;line-height:1.48;margin:18px 0">${esc(x.q)}</h3>${x.a.map((opt,i)=>`<button class="quiz-opt ${chosen!==null?(i===x.c?'correct':i===chosen?'wrong':''):''}" data-choose="${i}" ${chosen!==null?'disabled':''}><span class="letter">${'ABC'[i]}.</span>${esc(opt)}</button>`).join('')}${chosen!==null?`<div class="hint ${chosen===x.c?'good':'warn'}" style="margin-top:14px">${chosen===x.c?'✓ Chính xác.':'✕ Chưa đúng.'} ${esc(x.why)}</div><div class="btnrow"><button class="btn" id="quizNext">${state.quizIndex===state.quiz.length-1?'Xem tổng điểm':'Câu tiếp →'}</button></div>`:''}</div>`}
function mockBank(){let eligible=P.filter(p=>state.role==='both'||(state.role==='ds'?p.ds>=2:p.bi>=2));return eligible.flatMap(p=>p.questions.map(q=>({...q,project:p.id,source:p.name}))).sort(()=>Math.random()-.5)}
function mock(){if(!state.mockList.length)state.mockList=mockBank();const q=state.mockList[state.mockIndex%state.mockList.length];if(!q)return '<div class="empty">Chưa có câu hỏi.</div>';return `<div class="eyebrow">SPEAK OUT LOUD</div><h2 class="headline">Mock Interview — Nói như đi phỏng vấn thật</h2><p class="lead">Đọc câu hỏi và tự trả lời thành tiếng trong 60–90 giây. Chỉ bấm xem đáp án sau khi đã thử nói. Phần follow-up dùng để luyện manager hỏi sâu.</p><section class="grid"><div class="card span-8"><span class="pill purple">${esc(q.source)}</span><div class="interview-box"><div class="order">QUESTION ${state.mockIndex+1}</div><div class="prompt">${esc(q.q)}</div><p class="small muted">Nói theo: Business → My Role → How → Why → Result → Team Contribution.</p></div><div class="btnrow"><button class="btn" id="mockReveal">${state.mockShow?'Ẩn gợi ý':'Xem câu trả lời gợi ý'}</button><button class="btn secondary" id="mockNext">Câu khác →</button></div><div class="answer-panel ${state.mockShow?'open':''}"><b>Suggested answer (English)</b><p>${esc(q.a)}</p><b>Manager follow-up</b><p>${esc(q.deep)}</p></div></div><div class="card span-4"><h3>Self-check trước khi chuyển câu</h3>${list(["Đã nêu đúng business problem?","Đã nói rõ tôi trực tiếp làm gì?","Đã giải thích vì sao chọn công nghệ?","Có một con số hoặc deliverable thật?","Đã nêu impact cho team mà không bịa?","Có nêu limitation khi được hỏi?"])}<div class="sep"></div><div class="hint">Nếu chưa nói trôi chảy, đọc phần project tương ứng rồi thử lại bằng lời của chính mình.</div><button class="btn secondary smallbtn" style="margin-top:13px" data-project="${q.project}">Mở dự án này →</button></div></section>`}
function search(){const q=state.search.trim().toLowerCase();let items=[];if(q){P.forEach(p=>{if(`${p.name} ${p.focus} ${p.problem} ${p.objective}`.toLowerCase().includes(q))items.push({title:p.name,desc:p.focus,target:p.id,type:'Dự án'});p.concepts.forEach(c=>{if(`${c.t} ${c.d} ${c.e}`.toLowerCase().includes(q))items.push({title:c.t,desc:`${c.d} · ${p.name}`,target:p.id,type:'Khái niệm'})})});GLOSSARY.filter(x=>x.join(' ').toLowerCase().includes(q)).forEach(x=>items.push({title:x[1],desc:x[2],target:'glossary',type:x[0]}))}return `<div class="eyebrow">KNOWLEDGE SEARCH</div><h2 class="headline">Tìm kiếm: ${esc(state.search)}</h2><p class="lead">${items.length} kết quả. Từ khóa nên tìm: WER, RCA, feature, SQL, drift, insurance, Python, Talent.</p>${items.slice(0,35).map(x=>`<div class="search-result" data-go="${x.target}"><span class="pill">${esc(x.type)}</span><b>${esc(x.title)}</b><p>${esc(x.desc)}</p></div>`).join('')||'<div class="card empty">Chưa tìm được mục phù hợp. Hãy thử keyword ngắn hơn.</div>'}`}
function render(){updateBars();const titles={home:'Tổng quan ôn phỏng vấn',map:'Mind Maps · 6 dự án',foundations:'Data Preprocessing & Feature Engineering',rapid:'Ôn gấp · High-yield',flash:'Flashcards',quiz:'Quiz tự kiểm tra',mock:'Mock Interview',glossary:'Thư viện khái niệm',jd:'Principal Accountabilities',search:'Tìm kiếm'};const p=P.find(p=>p.id===state.page);$('#pageTitle').textContent=p?p.name:titles[state.page]||'Tổng quan';$('#main').innerHTML=p?section(p):state.page==='home'?home():state.page==='map'?mindmap():state.page==='foundations'?foundationPage():state.page==='rapid'?rapid():state.page==='flash'?flash():state.page==='quiz'?quiz():state.page==='mock'?mock():state.page==='glossary'?glossary():state.page==='jd'?jd():state.page==='search'?search():home();$('#main').insertAdjacentHTML('beforeend','<div class="page-footer">Offline study hub · Dữ kiện từ các tài liệu và mô tả bạn cung cấp · Các mục chưa xác minh được ghi rõ để tránh trình bày sai trong phỏng vấn.</div>')}
function clock(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function timerStop(){if(state.timerId){clearInterval(state.timerId);state.timerId=null}state.timerRunning=false}
function timerToggle(){if(state.timerRunning){timerStop();render();return}state.timerRunning=true;state.timerId=setInterval(()=>{if(state.timerSeconds>0){state.timerSeconds--;const e=$('#timerDisplay');if(e)e.textContent=clock(state.timerSeconds)}else{timerStop();notify('Hoàn thành vòng ôn 25 phút! Tự nói lại mạch dự án rồi nghỉ.')};},1000);render()}
function downloadTxt(filename,txt){const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),400)}
function copyText(txt){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>notify('Đã sao chép câu trả lời')).catch(()=>fallback())}else fallback();function fallback(){const el=document.createElement('textarea');el.value=txt;document.body.appendChild(el);el.select();try{document.execCommand('copy');notify('Đã sao chép')}catch(e){notify('Trình duyệt không cho phép sao chép tự động')}el.remove()}}

 const mp=e.target.closest('[data-map-project]');if(mp){state.mapProject=mp.dataset.mapProject;state.mapRecall=false;render();document.querySelector('.pm-select')?.scrollIntoView({block:'start',behavior:'instant'});return}

 const mo=e.target.closest('[data-map-open-section]');if(mo){const id=mo.dataset.mapId;const sec=+mo.dataset.mapOpenSection;if(state.page!=='map'&&state.page===id){document.getElementById('sec'+sec)?.scrollIntoView({behavior:'smooth',block:'start'})}else{state.mapBranch[id]=MAP_BRANCHES.findIndex(x=>x.section===sec);nav(id);setTimeout(()=>document.getElementById('sec'+sec)?.scrollIntoView({behavior:'smooth',block:'start'}),50)}return}

 const n=e.target.closest('[data-nav]');if(n){nav(n.dataset.nav);return}

 if(e.target.closest('#flashPrev')){state.flashIndex=Math.max(0,state.flashIndex-1);state.flashRevealed=false;render();return}
 if(e.target.closest('#flashNext')){state.flashIndex=(state.flashIndex+1)%Math.max(1,currentFlashList().length);state.flashRevealed=false;render();return}
 const r=e.target.closest('[data-rate]');if(r){const list=currentFlashList();const card=list[state.flashIndex];if(card){state.flashRatings[card.id]=r.dataset.rate;save('flashRatings',state.flashRatings);state.flashIndex=(state.flashIndex+1)%Math.max(1,currentFlashList().length);state.flashRevealed=false;render();notify(r.dataset.rate==='know'?'✓ Đã nhớ':'↺ Đã đưa vào danh sách ôn lại')}return}
 const co=e.target.closest('[data-copy-pitch]');if(co){copyText(P.find(p=>p.id===co.dataset.copyPitch).pitch);return}
 const ex=e.target.closest('[data-export-note]');if(ex){let p=P.find(p=>p.id===ex.dataset.exportNote);downloadTxt('Ghi_chu_'+p.id+'.txt',p.name+'\n\n'+(state.notes[p.id]||''));return}
 const choose=e.target.closest('[data-choose]');if(choose&&state.quizSelected===null){state.quizSelected=+choose.dataset.choose;state.quizScore+=state.quizSelected===state.quiz[state.quizIndex].c?1:0;render();return}
 if(e.target.closest('#quizNext')){state.quizIndex++;state.quizSelected=null;render();return}
 if(e.target.closest('#quizRestart')){quizStart();render();return}
 if(e.target.closest('#mockReveal')){state.mockShow=!state.mockShow;render();return}
 if(e.target.closest('#mockNext')){state.mockIndex++;state.mockShow=false;render();return}
 if(e.target.closest('#timerToggle')){timerToggle();return}
 if(e.target.closest('#timerReset')){timerStop();state.timerSeconds=25*60;render();return}
});
const first=getIdByHash();nav(P.some(x=>x.id===first)||['home','map','rapid','glossary','jd','flash','quiz','mock','search'].includes(first)?first:'home',false);

</script>
